function classifyLocation(loc) {
  if (!loc || typeof loc !== "string") return null;
  const s = loc.trim().toUpperCase();
  if (s.startsWith("PD")) return "K62";
  if (s.startsWith("PH")) return "K63";
  if (!/^P\d/.test(s)) return null;
  const stn = parseInt(s.substring(3, 5), 10);
  if (isNaN(stn)) return null;
  const afterDash = s.split("-")[1] || "";
  const lplMatch = afterDash.match(/^(\d+)/);
  const lpl = lplMatch ? parseInt(lplMatch[1], 10) : null;
  const lastDigit = lpl !== null ? lpl % 10 : null;
  const isEven = lastDigit !== null && lastDigit % 2 === 0;
  const isOdd = lastDigit !== null && lastDigit % 2 === 1;
  const t7 = s[6], t8 = s[7], t10 = s[9], t11 = s[10];
  const t1011 = (t10 || "") + (t11 || "");
  if (s.startsWith("P3")) {
    const t7d = /[0-9]/.test(t7 || "");
    const n = parseInt(t1011, 10);
    if (t7d || t8 === "A" || (t8 === "B" && !isNaN(n) && n >= 1 && n <= 13)) return "K55";
  }
  if (stn === 36) return "K61-36";
  if (s.startsWith("P101")) {
    if (isEven) return "K51";
    if (isOdd && stn >= 10 && stn <= 14) return "K52";
    if (isOdd && stn >= 15 && stn <= 18) return "K53";
  }
  if (s.startsWith("P102")) {
    if (isEven) return "K56";
    if (isOdd && stn >= 20 && stn <= 23) return "K53";
    if (isOdd && stn >= 24 && stn <= 27) return "K52";
  }
  if (s.startsWith("P4")) { if (isEven) return "K58"; if (isOdd) return "K56"; }
  if (s.startsWith("P6")) {
    if (isEven) return "K58";
    if (isOdd && stn >= 60 && stn <= 67) {
      if (lpl !== null) { if (lpl <= 43) return "K60"; if (lpl >= 45) return "K59"; }
    }
  }
  if (s.startsWith("P7")) {
    if (isEven) return "K61-7";
    if (isOdd && stn >= 71 && stn <= 77) {
      if (lpl !== null) { if (lpl <= 81) return "K59"; if (lpl >= 83) return "K60"; }
    }
  }
  return null;
}

function getZon(location) {
  if (!location) return "?";
  const l = String(location).toUpperCase();
  if (l.startsWith("P1")) return "1";
  if (l.startsWith("P3") || l.startsWith("PD")) return "3";
  if (l.startsWith("P4") || l.startsWith("P6") || l.startsWith("P7")) return "2";
  return "?";
}

function excelDateToISO(val) {
  if (!val) return null;
  if (val instanceof Date) {
    const y = val.getFullYear();
    const m = String(val.getMonth() + 1).padStart(2, "0");
    const d = String(val.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }
  if (typeof val === "string") {
    const v = val.trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10);
    const dotMatch = v.match(/^(\d{4})[./](\d{1,2})[./](\d{1,2})/);
    if (dotMatch) {
      return `${dotMatch[1]}-${String(dotMatch[2]).padStart(2,"0")}-${String(dotMatch[3]).padStart(2,"0")}`;
    }
    if (/^\d{8}$/.test(v)) {
      return `${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`;
    }
    const d = new Date(v);
    if (!isNaN(d.getTime())) {
      const y = d.getFullYear();
      const mo = String(d.getMonth() + 1).padStart(2, "0");
      const da = String(d.getDate()).padStart(2, "0");
      return `${y}-${mo}-${da}`;
    }
  }
  if (typeof val === "number" && val > 19000000 && val < 99999999) {
    const s = String(val);
    return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`;
  }
  if (typeof val === "number") {
    const d = new Date(Math.round((val - 25569) * 86400 * 1000));
    const y = d.getUTCFullYear();
    const mo = String(d.getUTCMonth() + 1).padStart(2, "0");
    const da = String(d.getUTCDate()).padStart(2, "0");
    return `${y}-${mo}-${da}`;
  }
  return null;
}

function getAvgangstid(routeCode) {
  const rc = String(routeCode || "").trim();
  if (!rc) return { tid: null, nastaDag: false };
  if (ROUTE_TIMES[rc]) return { tid: ROUTE_TIMES[rc], nastaDag: false };
  const n = parseInt(rc, 10);
  for (const r of ROUTE_RANGES) {
    if (!isNaN(n) && n >= r.from && n <= r.to) return { tid: r.time, nastaDag: false };
  }
  if (rc.startsWith("8")) return { tid: null, nastaDag: true };
  if (/^[3456]/.test(rc)) return { tid: "18:00", nastaDag: false };
  return { tid: null, nastaDag: false };
}

function minutesBeforeDeparture(devTime, avgTid) {
  if (!devTime || !avgTid) return null;
  const [dh, dm] = devTime.split(":").map(Number);
  const [ah, am] = avgTid.split(":").map(Number);
  if (isNaN(dh) || isNaN(ah)) return null;
  return (ah * 60 + am) - (dh * 60 + dm);
}

function formatMinBefore(mins, nastaDag) {
  if (nastaDag) return "nästa dag";
  if (mins === null) return "";
  if (mins < 0) return `${Math.abs(mins)} min EFTER avgång`;
  if (mins < 60) return `${mins} min före`;
  const h = Math.floor(mins / 60), m = mins % 60;
  return m === 0 ? `${h} tim före` : `${h}t ${m}m före`;
}

    } else {
      console.warn("localStorage blocked, data lives in memory only this session");
    }
  }
}

// Uppskattar localStorage-användning för AvvikelseLive-nycklarna (i bytes).
function getStorageBytes() {
  let total = 0;
  try {
    for (const key of [STORAGE_KEY, RADER_KEY, GOAL_KEY, COST_KEY, TIME_KEY]) {
      const v = localStorage.getItem(key);
      if (v) total += (key.length + v.length) * 2; // UTF-16 ≈ 2 bytes/tecken
    }
  } catch(e) {}
  return total;
}

// ── Orsak per scan ────────────────────────────────────────────────────────────
// Returnerar orsaksfördelningen för EN post, nedbruten per scan.
// - Har posten events med egna orsaker → räkna varje scan för sig.
// - Saknar events (gammal data) → hela count på VNR-dagens orsak (oförändrat beteende).
// Resultat: { orsak: antal, ... } som summerar till postens totala count.
//
// VIKTIGT: detta läser bara datan, skriver aldrig. Gammal data berörs inte.
function orsakBreakdown(record) {
  const fallback = () => ({ [record.orsak || "Okänd"]: record.count || 0 });
  if (!record.events || record.events.length === 0) return fallback();

  // Räkna bara events som har ett klockslag (en faktisk scan).
  const scans = record.events.filter(e => e && e.tid);
  if (scans.length === 0) return fallback();

  // Samla distinkta event-orsaker (ignorera tomma).
  const eventOrsaker = scans.map(e => e.orsak).filter(Boolean);
  const distinct = [...new Set(eventOrsaker)];

  // Lita bara på event-orsaker när de FAKTISKT är blandade (>1 distinkt orsak).
  // Är alla samma (eller saknas), använd VNR-dagens orsak. Detta skyddar mot äldre
  // data där alla events råkar bära en auto-stämpel som inte speglar den manuellt
  // satta dagsorsaken — och mot odelade dagar generellt.
  if (distinct.length <= 1) return fallback();

  const dist = {};
  for (const ev of scans) {
    const o = ev.orsak || record.orsak || "Okänd";
    dist[o] = (dist[o] || 0) + 1;
  }

  // Säkerhetskoll: om antal scans inte matchar count (kan hända vid äldre/ojämn data),
  // skala proportionellt så summan alltid blir record.count.
  const scanTotal = scans.length;
  const realCount = record.count || scanTotal;
  if (scanTotal !== realCount && scanTotal > 0) {
    const scaled = {};
    let assigned = 0;
    const keys = Object.keys(dist);
    keys.forEach((o, i) => {
      if (i === keys.length - 1) {
        scaled[o] = realCount - assigned; // sista får resten (undviker avrundningstapp)
      } else {
        const v = Math.round(dist[o] / scanTotal * realCount);
        scaled[o] = v;
        assigned += v;
      }
    });
    return scaled;
  }
  return dist;
}

// Bekvämlighets-iterator: anropar fn(orsak, antal) för varje orsak i en lista poster.
function forEachOrsak(records, fn) {
  for (const r of records) {
    const dist = orsakBreakdown(r);
    for (const [orsak, antal] of Object.entries(dist)) {
      if (antal > 0) fn(orsak, antal, r);
    }
  }
}

// ── Scan-detaljvy ─────────────────────────────────────────────────────────────
// Visar alla enskilda scans (events) för en VNR-dag och låter användaren sätta
// orsak per scan. Auto-detekteringen rörs INTE — varje scan har redan en default-orsak
// (kontroll om den var i en kedja, annars VNR-dagens orsak). Detaljvyn är frivillig.
//
// Props:
//   record   – posten (med .events)
//   onClose  – stäng utan att spara
//   onSave   – (updatedEvents, dominantOrsak) => void
function ScanDetailModal({ record, onClose, onSave }) {
  // Avgör om de sparade event-orsakerna faktiskt är blandade. Om alla är samma (eller
  // saknas), ignorera dem och utgå från VNR-dagens orsak — skyddar mot äldre felstämpling.
  const _evtOrsaker = (record.events || []).map(e => e && e.orsak).filter(Boolean);
  const _isMixed = new Set(_evtOrsaker).size > 1;
  const initial = (record.events && record.events.length)
    ? record.events.map((ev, i) => ({
        ...ev,
        _i: i,
        orsak: _isMixed ? (ev.orsak || record.orsak || "") : (record.orsak || ""),
      }))
    : [];
  const [evts, setEvts] = useState(initial);

  const setEvOrsak = (idx, val) => {
    setEvts(prev => prev.map(e => e._i === idx ? { ...e, orsak: val } : e));
  };
  const setAll = (val) => {
    setEvts(prev => prev.map(e => ({ ...e, orsak: val })));
  };

  // Sammanställning per orsak (för att visa fördelningen + härleda dominant orsak)
  const orsakCount = {};
  for (const e of evts) {
    const o = e.orsak || "(ingen)";
    orsakCount[o] = (orsakCount[o] || 0) + 1;
  }
  const orsakEntries = Object.entries(orsakCount).sort((a, b) => b[1] - a[1]);
  const dominant = orsakEntries[0]?.[0] === "(ingen)" ? (orsakEntries[1]?.[0] || "") : orsakEntries[0]?.[0];
  const isMixed = orsakEntries.filter(([o]) => o !== "(ingen)").length > 1;

  const sorted = [...evts].sort((a, b) => (a.tid || "").localeCompare(b.tid || ""));

  return (
    <div
      onClick={onClose}
      style={{
        position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)",
        display: "flex", alignItems: "center", justifyContent: "center",
        zIndex: 1000, padding: 20,
      }}
    >
      <div
        onClick={e => e.stopPropagation()}
        style={{
          background: "#0f0f18", border: "1px solid #2a2a3a", borderRadius: 12,
          maxWidth: 720, width: "100%", maxHeight: "85vh", display: "flex", flexDirection: "column",
        }}
      >
        {/* Header */}
        <div style={{ padding: "18px 22px", borderBottom: "1px solid #1e1e2e" }}>
          <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
            <span style={{ fontSize: 16, fontWeight: 800, fontFamily: "monospace", color: "#f0f0f5" }}>{record.vnr}</span>
            <span style={{ fontSize: 12, color: "#7c6af7" }}>{record.datum}</span>
            <Badge text={record.zon} />
            {record.kbana && <span style={{ color: "#f97316", fontSize: 11, fontWeight: 700 }}>{record.kbana}</span>}
            <span style={{ marginLeft: "auto", fontSize: 12, color: "#666" }}>{evts.length} scans</span>
          </div>
          {isMixed && (
            <div style={{ marginTop: 8, fontSize: 11, color: "#e879c5" }}>
              ⚠ Blandade orsaker: {orsakEntries.filter(([o]) => o !== "(ingen)").map(([o, n]) => `${o} ×${n}`).join(" · ")}
            </div>
          )}
        </div>

        {/* Snabbåtgärd: sätt alla */}
        <div style={{ padding: "10px 22px", borderBottom: "1px solid #1e1e2e", display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <span style={{ fontSize: 11, color: "#666" }}>Sätt alla till:</span>
          <select
            onChange={e => { if (e.target.value) setAll(e.target.value); e.target.value = ""; }}
            defaultValue=""
            style={{ background: "#16161f", color: "#f0f0f5", border: "1px solid #2a2a3a", borderRadius: 6, padding: "4px 8px", fontSize: 11, cursor: "pointer" }}
          >
            <option value="">— välj —</option>
            {ORSAKER.map(o => <option key={o} value={o}>{o}</option>)}
          </select>
          <span style={{ fontSize: 10, color: "#444" }}>eller sätt per scan nedan</span>
        </div>

        {/* Scan-lista */}
        <div style={{ overflowY: "auto", padding: "12px 22px", flex: 1 }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
            {sorted.map((e) => (
              <div key={e._i} style={{
                display: "grid",
                gridTemplateColumns: "62px 1fr 180px",
                gap: 10, alignItems: "center",
                background: e.inKontroll ? "#15101a" : "#13131c",
                border: `1px solid ${e.inKontroll ? "#3a2348" : "#1e1e2e"}`,
                borderRadius: 6, padding: "7px 10px",
              }}>
                <span style={{ fontFamily: "monospace", fontSize: 12, color: "#7c6af7" }}>🕐 {e.tid || "—"}</span>
                <div style={{ fontSize: 11, color: "#8a8a9a", fontFamily: "monospace" }}>
                  {e.location || "—"}
                  {e.inKontroll && <span style={{ color: "#e879c5", marginLeft: 8, fontWeight: 700 }}>i kedja</span>}
                  {e.route && <span style={{ color: "#666", marginLeft: 8 }}>Tur {e.route}</span>}
                  {e.avgangstid && <span style={{ color: "#60a5fa", marginLeft: 6 }}>avg {e.avgangstid}</span>}
                </div>
                <OrsaksSelect value={e.orsak} onChange={v => setEvOrsak(e._i, v)} />
              </div>
            ))}
            {sorted.length === 0 && (
              <div style={{ color: "#555", fontSize: 12, textAlign: "center", padding: "30px 0" }}>
                Inga scan-detaljer finns sparade för den här posten.<br />
                <span style={{ fontSize: 11, color: "#444" }}>(Äldre poster importerade innan scan-detaljer infördes.)</span>
              </div>
            )}
          </div>
        </div>

        {/* Footer */}
        <div style={{ padding: "14px 22px", borderTop: "1px solid #1e1e2e", display: "flex", alignItems: "center", gap: 12 }}>
          <span style={{ fontSize: 11, color: "#666" }}>
            Dominant orsak: <strong style={{ color: "#c0c0d0" }}>{dominant || "—"}</strong>
            {isMixed && <span style={{ color: "#e879c5" }}> (blandad — VNR-dagen får dominant orsak)</span>}
          </span>
          <button onClick={onClose} style={{ marginLeft: "auto", background: "#1e1e2e", color: "#888", border: "none", borderRadius: 6, padding: "7px 16px", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>Avbryt</button>
          <button
            onClick={() => onSave(evts.map(({ _i, ...rest }) => rest), dominant)}
            disabled={sorted.length === 0}
            style={{ background: sorted.length === 0 ? "#1e1e2e" : "#7c6af7", color: sorted.length === 0 ? "#555" : "#fff", border: "none", borderRadius: 6, padding: "7px 18px", fontSize: 12, fontWeight: 700, cursor: sorted.length === 0 ? "default" : "pointer", fontFamily: "inherit" }}
          >Spara orsaker</button>
        </div>
      </div>
    </div>
  );
}

// ── Import Tab ────────────────────────────────────────────────────────────────

function ImportTab({ onSave, existingData }) {
  const [groups, setGroups] = useState([]);
  const [importing, setImporting] = useState(false);
  const [datum, setDatum] = useState("");
  const [saved, setSaved] = useState(false);
  const [mergeInfo, setMergeInfo] = useState(null);
  const [restoreInfo, setRestoreInfo] = useState(null);
  const [raderInfo, setRaderInfo] = useState(null);

  const handleRaderFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setImporting(true);

    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: true });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

    let hIdx = -1;
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i].map(c => String(c).toLowerCase().trim());
      if (r.includes("station") && r.includes("rader")) {
        hIdx = i; break;
      }
    }
    if (hIdx === -1) { alert("Hittade ingen header med Station och Rader."); setImporting(false); return; }

    const headers = rows[hIdx].map(c => String(c).toLowerCase().trim());
    const stationCol = headers.findIndex(h => h === "station");
    const raderCol = headers.findIndex(h => h === "rader");
    const datumCol = headers.findIndex(h => h.includes("datum"));

    const dataRows = rows.slice(hIdx + 1).filter(r => r[stationCol] !== "" && r[raderCol] !== "");

    let detDatum = "";
    if (datumCol !== -1 && dataRows[0]) {
      detDatum = excelDateToISO(dataRows[0][datumCol]) || "";
    }
    if (!detDatum) { detDatum = datum; }

    const zonRader = { "1": 0, "2": 0, "3": 0 };
    for (const r of dataRows) {
      const z = stationToZon(r[stationCol]);
      const rader = parseInt(r[raderCol], 10) || 0;
      if (zonRader[z] !== undefined) zonRader[z] += rader;
    }

    const allRader = loadRader();
    allRader[detDatum] = zonRader;
    saveRader(allRader);

    const total = zonRader["1"] + zonRader["2"] + zonRader["3"];
    setRaderInfo({ datum: detDatum, total, zonRader });
    setImporting(false);
    e.target.value = "";
  };

  const handleAppend = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setImporting(true);

    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });

    const sheetName = wb.SheetNames.find(n => n.toLowerCase().includes("rådata") || n.toLowerCase().includes("radata"));
    if (!sheetName) {
      alert("Hittade ingen 'Rådata'-flik i filen.");
      setImporting(false);
      return;
    }

    const sheet = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

    const headers = rows[0].map(c => String(c).toLowerCase().trim());
    const datumCol = headers.findIndex(h => h.includes("datum"));
    const vnrCol   = headers.findIndex(h => h.includes("vnr") || h.includes("varunummer"));
    const locCol   = headers.findIndex(h => h.includes("lagerplats") || h.includes("location"));
    const kbanaCol = headers.findIndex(h => h.includes("k-bana") || h === "kbana");
    const zonCol   = headers.findIndex(h => h.includes("zon"));
    const turCol   = headers.findIndex(h => h === "tur" || h.includes("route"));
    const avgCol   = headers.findIndex(h => h.includes("avgångstid") || h.includes("avgangstid"));
    const minCol   = headers.findIndex(h => h.includes("min före") || h.includes("min fore"));
    const shipCol  = headers.findIndex(h => h.includes("ship to"));
    const antCol   = headers.findIndex(h => h.includes("antal"));
    const orsCol   = headers.findIndex(h => h.includes("orsak"));
    const komCol   = headers.findIndex(h => h.includes("kommentar"));

    const dataRows = rows.slice(1).filter(r => r[datumCol] && r[vnrCol]);
    const newRecords = dataRows.map(r => ({
      datum: excelDateToISO(r[datumCol]) || String(r[datumCol]).slice(0, 10),
      vnr: String(r[vnrCol]).trim(),
      locations: r[locCol] ? [String(r[locCol]).trim()] : [],
      kbana: kbanaCol !== -1 ? String(r[kbanaCol] || "").trim() : "",
      zon: String(r[zonCol] || "").replace("Zon ", "").trim(),
      routeCode: turCol !== -1 ? String(r[turCol] || "").trim() : "",
      avgangstid: avgCol !== -1 ? String(r[avgCol] || "").trim().replace("nästa dag", "") : "",
      nastaDag: avgCol !== -1 && String(r[avgCol] || "").includes("nästa dag"),
      minForeAvgang: minCol !== -1 && r[minCol] !== "" ? (parseInt(r[minCol]) || null) : null,
      shipTo: shipCol !== -1 ? String(r[shipCol] || "").trim() : "",
      count: parseInt(r[antCol]) || 1,
      orsak: String(r[orsCol] || "").trim(),
      kommentar: String(r[komCol] || "").trim(),
      afterHours: 0,
      beforeWork: 0,
      hours: [],
      times: [],
      events: [],
    }));

    const existing = (existingData || []);
    const existingKey = (r) => `${r.datum}__${r.vnr}`;
    const existingMap = new Map(existing.map(r => [existingKey(r), r]));
    let added = 0, skipped = 0;
    for (const r of newRecords) {
      const k = existingKey(r);
      if (!existingMap.has(k)) {
        existingMap.set(k, r);
        added++;
      } else {
        skipped++;
      }
    }
    const merged = [...existingMap.values()];
    saveData(merged);
    setRestoreInfo({ count: added, days: [...new Set(newRecords.map(r => r.datum))].length, skipped });
    setImporting(false);
    e.target.value = "";
    setTimeout(() => window.location.reload(), 1500);
  };

  const handleRestore = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setImporting(true);

    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });

    const sheetName = wb.SheetNames.find(n => n.toLowerCase().includes("rådata") || n.toLowerCase().includes("radata"));
    if (!sheetName) {
      alert("Hittade ingen 'Rådata'-flik i filen.");
      setImporting(false);
      return;
    }

    const sheet = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

    const headers = rows[0].map(c => String(c).toLowerCase().trim());
    const datumCol = headers.findIndex(h => h.includes("datum"));
    const vnrCol   = headers.findIndex(h => h.includes("vnr") || h.includes("varunummer"));
    const locCol   = headers.findIndex(h => h.includes("lagerplats") || h.includes("location"));
    const zonCol   = headers.findIndex(h => h.includes("zon"));
    const antCol   = headers.findIndex(h => h.includes("antal"));
    const orsCol   = headers.findIndex(h => h.includes("orsak"));
    const komCol   = headers.findIndex(h => h.includes("kommentar"));

    const dataRows = rows.slice(1).filter(r => r[datumCol] && r[vnrCol]);
    const records = dataRows.map(r => ({
      datum: excelDateToISO(r[datumCol]) || String(r[datumCol]).slice(0, 10),
      vnr: String(r[vnrCol]).trim(),
      locations: r[locCol] ? [String(r[locCol]).trim()] : [],
      zon: String(r[zonCol] || "").replace("Zon ", "").trim(),
      count: parseInt(r[antCol]) || 1,
      orsak: String(r[orsCol] || "").trim(),
      kommentar: String(r[komCol] || "").trim(),
      afterHours: 0,
      beforeWork: 0,
      hours: [],
      times: [],
    }));

    await saveData(records);
    setRestoreInfo({ count: records.length, days: [...new Set(records.map(r => r.datum))].length });
    setImporting(false);
    e.target.value = "";
  };

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setImporting(true);
    setSaved(false);

    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: true });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

    let headerIdx = -1;
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i].map(c => String(c).toLowerCase());
      if (r.some(c => c.includes("item number")) && r.some(c => c === "location")) {
        headerIdx = i; break;
      }
    }
    if (headerIdx === -1) {
      alert("Hittade ingen giltig Book1-header (2nd Item Number + Location).");
      setImporting(false);
      return;
    }

    const headers = rows[headerIdx].map(c => String(c).toLowerCase().trim());
    const vnrCol    = headers.findIndex(h => h.includes("item number") && !h.includes("branch"));
    const locCol    = headers.findIndex(h => h === "location");
    const routeCol  = headers.findIndex(h => h.includes("route"));
    const shipCol   = headers.findIndex(h => h.includes("ship to"));
    const timeCol   = headers.findIndex(h => h.includes("time updated"));
    let dateCol = headers.findIndex(h => h.includes("date updated"));
    if (dateCol === -1) dateCol = headers.findIndex(h => h.includes("creation date"));
    if (dateCol === -1) dateCol = headers.findIndex(h => h.includes("date"));

    const dataRows = rows.slice(headerIdx + 1).filter(r => r[vnrCol] && String(r[vnrCol]).trim());

    const parseTimeFi = (raw) => {
      if (raw === undefined || raw === "") return null;
      let h = -1, m = -1, s = 0;
      if (raw instanceof Date) {
        h = raw.getHours(); m = raw.getMinutes(); s = raw.getSeconds();
      } else {
        const str = String(raw).trim();
        if (str.includes(":")) {
          const p = str.split(":"); h = parseInt(p[0]); m = parseInt(p[1]); s = parseInt(p[2] || 0);
        } else {
          const num = parseInt(String(raw).replace(/\D/g, ""), 10);
          if (!isNaN(num)) {
            s = num % 100; m = Math.floor(num / 100) % 100; h = Math.floor(num / 10000);
          }
        }
      }
      if (h < 0) return null;
      // JDE_TIME_OFFSET: JD Edwards exporterar "Time Updated" en timme fel mot lokal tid.
      // Detta justerar tillbaka. OBS: om JDE-exporten ändras (t.ex. vid systemuppgradering
      // eller om tidszonshanteringen rättas) måste denna rad ses över — annars blir ALLA
      // tidsstämplar och "min före avgång"-beräkningar fel utan synligt felmeddelande.
      const JDE_TIME_OFFSET = -1;
      h = h + JDE_TIME_OFFSET;
      if (h < 0) h += 24;
      return { h, m, s };
    };

    let detectedDatum = "";
    if (dateCol !== -1 && dataRows[0]) {
      detectedDatum = excelDateToISO(dataRows[0][dateCol]) || "";
    }
    if (detectedDatum) setDatum(detectedDatum);

    const map = new Map();
    for (const row of dataRows) {
      const vnr = String(row[vnrCol]).trim();
      const loc = String(row[locCol] || "").trim();
      const route = String(row[routeCol] || "").trim();
      const ship = String(row[shipCol] || "").trim();
      if (!map.has(vnr)) {
        map.set(vnr, { vnr, locations: new Set(), routes: new Set(), ships: new Set(),
          count: 0, afterHours: 0, beforeWork: 0, hours: [], times: [], firstTimeMs: Infinity, events: [] });
      }
      const entry = map.get(vnr);
      entry.count++;
      if (loc) entry.locations.add(loc);
      if (route) entry.routes.add(route);
      if (ship) entry.ships.add(ship);

      const t = parseTimeFi(row[timeCol]);
      let tStr = "";
      if (t) {
        tStr = `${String(t.h).padStart(2,"0")}:${String(t.m).padStart(2,"0")}`;
        entry.times.push(tStr);
        const tMs = t.h * 3600000 + t.m * 60000 + t.s * 1000;
        if (tMs < entry.firstTimeMs) entry.firstTimeMs = tMs;
        if (t.h > 15 || (t.h === 15 && t.m >= 30)) entry.afterHours++;
        if (t.h < 8) entry.beforeWork++;
        entry.hours.push(t.h);
      }

      const ev = getAvgangstid(route);
      const evMin = (tStr && ev.tid) ? minutesBeforeDeparture(tStr, ev.tid) : null;
      entry.events.push({
        tid: tStr,
        route,
        ship,
        location: loc,
        avgangstid: ev.tid || "",
        nastaDag: ev.nastaDag,
        minForeAvgang: evMin,
      });
    }

    const result = [];
    for (const [vnr, entry] of map.entries()) {
      const locsArr = [...entry.locations];
      const routesArr = [...entry.routes];
      const shipsArr = [...entry.ships];
      const zon = getZon(locsArr[0]);
      const kbana = classifyLocation(locsArr[0]);
      const sortedTimes = entry.times.sort();
      const firstTime = entry.firstTimeMs === Infinity ? "" : sortedTimes[0];

      const routeCode = routesArr[0] || "";
      const { tid: avgangstid, nastaDag } = getAvgangstid(routeCode);
      const minFore = (firstTime && avgangstid) ? minutesBeforeDeparture(firstTime, avgangstid) : null;

      const autoOrsak = entry.beforeWork === entry.count
        ? "Före 08:00"
        : entry.afterHours === entry.count
          ? "Utanför min arbetstid"
          : "";
      result.push({
        vnr,
        locations: locsArr,
        routes: routesArr,
        ships: shipsArr,
        routeCode,
        shipTo: shipsArr[0] || "",
        avgangstid: avgangstid || "",
        nastaDag,
        minForeAvgang: minFore,
        zon,
        count: entry.count,
        afterHours: entry.afterHours,
        beforeWork: entry.beforeWork,
        hours: entry.hours,
        times: sortedTimes,
        firstTime,
        kbana: kbana || "",
        orsak: autoOrsak,
        kommentar: "",
        events: entry.events,
      });
    }

    const KONTROLL_WINDOW_MS = 2 * 60 * 1000;
    const allScans = [];
    for (const row of dataRows) {
      const vnr = String(row[vnrCol]).trim();
      const loc = String(row[locCol] || "").trim();
      const locPrefix = loc.slice(0, 2).toUpperCase();
      const t = parseTimeFi(row[timeCol]);
      if (t) {
        const timeMs = (t.h * 3600 + t.m * 60 + t.s) * 1000;
        allScans.push({ vnr, locPrefix, timeMs, inKontroll: false });
      }
    }
    allScans.sort((a, b) => a.timeMs - b.timeMs);
    // Mark each individual scan that participates in a kontroll-cluster
    for (let i = 0; i < allScans.length; i++) {
      const cluster = [allScans[i]];
      for (let j = i + 1; j < allScans.length; j++) {
        if (allScans[j].timeMs - allScans[i].timeMs > KONTROLL_WINDOW_MS) break;
        if (allScans[j].locPrefix === allScans[i].locPrefix) cluster.push(allScans[j]);
      }
      if (cluster.length >= 2) cluster.forEach(s => { s.inKontroll = true; });
    }
    // Per VNR: count kontroll-scans vs total scans
    const kontrollStats = new Map(); // vnr -> { kontroll, total }
    for (const s of allScans) {
      if (!kontrollStats.has(s.vnr)) kontrollStats.set(s.vnr, { kontroll: 0, total: 0 });
      const st = kontrollStats.get(s.vnr);
      st.total++;
      if (s.inKontroll) st.kontroll++;
    }
    for (const r of result) {
      const st = kontrollStats.get(r.vnr);
      r.kontrollScans = st ? st.kontroll : 0;
      r.kontrollTotal = st ? st.total : 0;
      // Auto-set Kontroll only when the MAJORITY of scans are in a kontroll-cluster,
      // and only if no orsak is already set. Mixed cases are flagged, not auto-set.
      const isMostlyKontroll = st && st.total > 0 && st.kontroll / st.total >= 0.5;
      if (isMostlyKontroll && !r.orsak) r.orsak = "Kontrollavvikelse";
    }

    // Tag each individual event with its kontroll-status so the detail view can show
    // a sensible per-scan default. We match scans back to events by VNR + time.
    // Build a lookup: "vnr|HH:MM" -> was any scan at that minute in a kontroll-cluster.
    const scanKontrollByKey = new Map();
    for (const s of allScans) {
      // reconstruct HH:MM from timeMs
      const totalMin = Math.floor(s.timeMs / 60000);
      const hh = String(Math.floor(totalMin / 60) % 24).padStart(2, "0");
      const mm = String(totalMin % 60).padStart(2, "0");
      const key = `${s.vnr}|${hh}:${mm}`;
      if (s.inKontroll) scanKontrollByKey.set(key, true);
    }
    for (const r of result) {
      if (!r.events) continue;
      for (const ev of r.events) {
        const key = `${r.vnr}|${ev.tid}`;
        ev.inKontroll = scanKontrollByKey.get(key) === true;
        // Default-orsak per scan = VNR-dagens orsak. inKontroll är BARA en markering
        // (visas som "i kedja" i detaljvyn) — den sätter INTE orsaken. Annars skulle en
        // dag som bedöms som t.ex. Saldofel ändå räknas som Kontroll per scan.
        ev.orsak = r.orsak || "";
      }
    }

    const detDatum = detectedDatum || datum;
    const existing = (existingData || []).filter(r => r.datum === detDatum);
    const existingByVNR = new Map(existing.map(r => [r.vnr, r]));
    let updated = 0, added = 0;
    const merged = [];
    for (const g of result) {
      const prev = existingByVNR.get(g.vnr);
      if (prev) {
        merged.push({ ...g, orsak: prev.orsak, kommentar: prev.kommentar, alreadyExists: true });
        updated++;
      } else {
        merged.push({ ...g, alreadyExists: false });
        added++;
      }
    }
    merged.sort((a, b) => (a.firstTime || "99:99").localeCompare(b.firstTime || "99:99"));
    setGroups(merged);
    setMergeInfo({ updated, added });
    setImporting(false);
  };

  const updateGroup = (vnr, field, val) => {
    setGroups(prev => prev.map(g => g.vnr === vnr ? { ...g, [field]: val } : g));
  };

  const handleSave = () => {
    if (!datum) { alert("Ange datum."); return; }
    const records = groups.map(g => ({
      datum,
      vnr: g.vnr,
      locations: g.locations,
      zon: g.zon,
      count: g.count,
      afterHours: g.afterHours || 0,
      beforeWork: g.beforeWork || 0,
      hours: g.hours || [],
      times: g.times || [],
      kbana: g.kbana || "",
      routeCode: g.routeCode || "",
      shipTo: g.shipTo || "",
      avgangstid: g.avgangstid || "",
      nastaDag: g.nastaDag || false,
      minForeAvgang: g.minForeAvgang ?? null,
      orsak: g.orsak || "Okänd",
      kommentar: g.kommentar,
      events: g.events || [],
    }));
    onSave(records, datum);
    setSaved(true);
  };

  const newGroups = groups.filter(g => !g.alreadyExists);
  const allDone = newGroups.length > 0 && newGroups.every(g => g.orsak);
  const donePct = newGroups.length ? Math.round(newGroups.filter(g => g.orsak).length / newGroups.length * 100) : 0;
  const okandWarn = newGroups.filter(g => g.count > 1 && g.orsak === "Okänd");
  // Blandade fall: VNR med scans både i och utanför kontrollkedja samma dag.
  // Dessa har troligen mer än en rotorsak och bör granskas manuellt.
  const mixedWarn = newGroups.filter(g =>
    g.kontrollScans > 0 && g.kontrollTotal > g.kontrollScans
  );

  return (
    <div>
      <div style={{ display: "flex", gap: 16, alignItems: "center", marginBottom: 24, flexWrap: "wrap" }}>
        <label style={{
          background: "#7c6af7",
          color: "#fff",
          borderRadius: 8,
          padding: "10px 20px",
          cursor: "pointer",
          fontWeight: 700,
          fontSize: 13,
          letterSpacing: 0.5,
          transition: "opacity .15s",
        }}>
          {importing ? "Läser..." : "📂 Ladda avvikelsefil"}
          <input type="file" accept=".xlsx,.xls" onChange={handleFile} style={{ display: "none" }} />
        </label>
        <label style={{
          background: "#1e1e2e",
          color: "#888",
          borderRadius: 8,
          padding: "10px 20px",
          cursor: "pointer",
          fontWeight: 700,
          fontSize: 13,
          letterSpacing: 0.5,
          border: "1px solid #2a2a3a",
        }}>
          ↩ Återställ från export
          <input type="file" accept=".xlsx,.xls" onChange={handleRestore} style={{ display: "none" }} />
        </label>
        <label style={{
          background: "#1e2e1e",
          color: "#4ade80",
          borderRadius: 8,
          padding: "10px 20px",
          cursor: "pointer",
          fontWeight: 700,
          fontSize: 13,
          letterSpacing: 0.5,
          border: "1px solid #2a4a2a",
        }}>
          ＋ Lägg till från export
          <input type="file" accept=".xlsx,.xls" onChange={handleAppend} style={{ display: "none" }} />
        </label>
        <label style={{
          background: "#1e1e2e",
          color: "#888",
          borderRadius: 8,
          padding: "10px 20px",
          cursor: "pointer",
          fontWeight: 700,
          fontSize: 13,
          letterSpacing: 0.5,
          border: "1px solid #2a2a3a",
        }}>
          📊 Ladda rader-fil
          <input type="file" accept=".xlsx,.xls" onChange={handleRaderFile} style={{ display: "none" }} />
        </label>

        {groups.length > 0 && (
          <>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <label style={{ fontSize: 12, color: "#888" }}>Datum:</label>
              <input
                type="date"
                value={datum}
                onChange={e => setDatum(e.target.value)}
                style={{
                  background: "#16161f",
                  border: "1px solid #2a2a3a",
                  color: "#f0f0f5",
                  borderRadius: 6,
                  padding: "6px 10px",
                  fontSize: 13,
                }}
              />
            </div>
            <div style={{ fontSize: 12, color: "#888" }}>
              {newGroups.filter(g => g.orsak).length}/{newGroups.length} nya
              <div style={{
                width: 120, height: 4, background: "#2a2a3a", borderRadius: 2, marginTop: 4,
              }}>
                <div style={{ width: `${donePct}%`, height: "100%", background: "#7c6af7", borderRadius: 2, transition: "width .3s" }} />
              </div>
            </div>
            <button
              onClick={handleSave}
              disabled={saved || !datum}
              style={{
                marginLeft: "auto",
                background: saved ? "#2a2a3a" : !datum ? "#2a2a3a" : allDone ? "#7c6af7" : "#4ade80",
                color: saved || !datum ? "#555" : "#0a0a0f",
                border: "none",
                borderRadius: 8,
                padding: "10px 24px",
                fontWeight: 700,
                fontSize: 13,
                cursor: saved || !datum ? "not-allowed" : "pointer",
                letterSpacing: 0.5,
              }}
            >
              {saved ? "✓ Sparat" : !datum ? "Ange datum först" : allDone ? "Spara alla" : `Spara (${newGroups.filter(g => !g.orsak).length} saknar orsak)`}
            </button>
          </>
        )}
      </div>

      {raderInfo && (
        <div style={{
          background: "#0d1520",
          border: "1px solid #1a3a4a",
          borderRadius: 8,
          padding: "10px 16px",
          marginBottom: 16,
          fontSize: 12,
          color: "#60a5fa",
        }}>
          ✓ Sparade rader för <strong>{raderInfo.datum}</strong>: totalt <strong>{raderInfo.total.toLocaleString("sv-SE")}</strong> rader
          {" "}(Z1: {raderInfo.zonRader["1"].toLocaleString("sv-SE")} · Z2: {raderInfo.zonRader["2"].toLocaleString("sv-SE")} · Z3: {raderInfo.zonRader["3"].toLocaleString("sv-SE")})
        </div>
      )}

      {restoreInfo && (
        <div style={{
          background: "#0d1a0d",
          border: "1px solid #1a4a1a",
          borderRadius: 8,
          padding: "10px 16px",
          marginBottom: 16,
          fontSize: 12,
          color: "#4ade80",
        }}>
          ✓ Återställde <strong>{restoreInfo.count}</strong> poster från <strong>{restoreInfo.days}</strong> dagar. Ladda om appen för att se historiken.
        </div>
      )}

      {mergeInfo && (
        <div style={{
          background: "#13131c",
          border: "1px solid #2a2a3a",
          borderRadius: 8,
          padding: "10px 16px",
          marginBottom: 16,
          fontSize: 12,
          color: "#888",
          display: "flex",
          gap: 20,
        }}>
          <span>✓ <strong style={{color:"#4ade80"}}>{mergeInfo.updated}</strong> VNR uppdaterade (orsak behållen)</span>
          <span>+ <strong style={{color:"#7c6af7"}}>{mergeInfo.added}</strong> nya VNR att bedöma</span>
        </div>
      )}

      {okandWarn.length > 0 && (
        <div style={{
          background: "#1a1200",
          border: "1px solid #7a5a00",
          borderRadius: 8,
          padding: "10px 16px",
          marginBottom: 16,
          fontSize: 12,
          color: "#f0c040",
          display: "flex",
          alignItems: "center",
          gap: 10,
        }}>
          ⚠ <strong>{okandWarn.length} VNR</strong> har fler än 1 avvikelse men är satta till Okänd:
          {" "}{okandWarn.map(g => `${g.vnr} (×${g.count})`).join(", ")}
        </div>
      )}

      {mixedWarn.length > 0 && (
        <div style={{
          background: "#1a0d18",
          border: "1px solid #6a2a5a",
          borderRadius: 8,
          padding: "10px 16px",
          marginBottom: 16,
          fontSize: 12,
          color: "#e879c5",
        }}>
          <div style={{ marginBottom: 4 }}>
            ⚠ <strong>{mixedWarn.length} VNR</strong> har scans både i kontrollkedja OCH utanför samma dag – granska orsaken, kan ha flera rotorsaker:
          </div>
          <div style={{ color: "#c08ab0", lineHeight: 1.6 }}>
            {mixedWarn.map(g => `${g.vnr} (${g.kontrollScans}/${g.kontrollTotal} i kedja)`).join(" · ")}
          </div>
        </div>
      )}

      {groups.length === 0 && !importing && (
        <div style={{ textAlign: "center", padding: "60px 0", color: "#444" }}>
          <div style={{ fontSize: 48, marginBottom: 12 }}>📋</div>
          <div style={{ fontSize: 14 }}>Ladda upp en X08-fil för att börja</div>
        </div>
      )}

      {groups.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <div style={{
            display: "grid",
            gridTemplateColumns: "40px 1fr 60px 48px 180px 1fr",
            gap: 8,
            padding: "6px 12px",
            fontSize: 10,
            color: "#555",
            letterSpacing: 1,
            textTransform: "uppercase",
          }}>
            <span>#</span><span>VNR / Platser</span><span style={{textAlign:"center"}}>Antal</span><span>Zon</span><span>Orsak</span><span>Kommentar</span>
          </div>

          {groups.filter(g => !g.alreadyExists).map((g, i) => (
            <div key={g.vnr} style={{
              display: "grid",
              gridTemplateColumns: "40px 1fr 60px 48px 180px 1fr",
              gap: 8,
              alignItems: "center",
              background: g.orsak ? "#13131c" : "#0f0f18",
              border: `1px solid ${g.orsak ? "#2a2a3a" : "#1e1e2e"}`,

              <span style={{ fontSize: 11, color: "#444" }}>{i + 1}</span>

                </div>

                  border: "1px solid #2a2a3a",
                  color: "#f0f0f5",
                  borderRadius: 6,

      )}
    </div>
  );
}

// ── Historik Tab ──────────────────────────────────────────────────────────────

function HistorikTab({ data, onDelete, onUpdate, onUpdateEvents, onMove }) {
  const [filterDatum, setFilterDatum] = useState("");
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [editRow, setEditRow] = useState(null);
  const [editOrsak, setEditOrsak] = useState("");
  const [editKommentar, setEditKommentar] = useState("");
  const [detailRow, setDetailRow] = useState(null); // { datum, vnr } för scan-detaljvy
  const [moveDate, setMoveDate] = useState(null);
  const [moveTarget, setMoveTarget] = useState("");
  const [filterZon, setFilterZon] = useState("");
  const [filterOrsak, setFilterOrsak] = useState("");
  const [searchText, setSearchText] = useState("");

  const dates = [...new Set(data.map(r => r.datum))].sort().reverse();

  const filtered = data.filter(r => {
    if (filterDatum && r.datum !== filterDatum) return false;
    if (filterZon && r.zon !== filterZon) return false;
    if (filterOrsak && r.orsak !== filterOrsak) return false;
    if (searchText) {
      const q = searchText.toLowerCase();
      const hay = `${r.vnr || ""} ${r.kommentar || ""} ${r.locations?.join(" ") || ""} ${r.routeCode || ""} ${r.kbana || ""} ${r.shipTo || ""}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const byDate = {};
  for (const r of filtered) {
    if (!byDate[r.datum]) byDate[r.datum] = [];
    byDate[r.datum].push(r);
  }

  const sortedDates = Object.keys(byDate).sort().reverse();

  return (
    <div>
      <div style={{ display: "flex", gap: 10, marginBottom: 20, flexWrap: "wrap" }}>
        <select value={filterDatum} onChange={e => setFilterDatum(e.target.value)} style={selectStyle}>
          <option value="">Alla datum</option>
          {dates.map(d => <option key={d} value={d}>{d}</option>)}
        </select>
        <select value={filterZon} onChange={e => setFilterZon(e.target.value)} style={selectStyle}>
          <option value="">Alla zoner</option>
          {["1","2","3"].map(z => <option key={z} value={z}>Zon {z}</option>)}
        </select>
        <select value={filterOrsak} onChange={e => setFilterOrsak(e.target.value)} style={selectStyle}>
          <option value="">Alla orsaker</option>
          {ORSAKER.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
        <input
          type="text"
          placeholder="🔍 Sök VNR, kommentar, plats, tur..."
          value={searchText}
          onChange={e => setSearchText(e.target.value)}
          style={{
            background: "#16161f",
            color: "#f0f0f5",
            border: "1px solid #2a2a3a",
            borderRadius: 6,
            padding: "6px 10px",
            fontSize: 12,
            outline: "none",
            minWidth: 240,
            fontFamily: "inherit",
          }}
        />
        <span style={{ marginLeft: "auto", fontSize: 12, color: "#555", alignSelf: "center" }}>
          {filtered.length} poster
        </span>
      </div>

      {sortedDates.length === 0 && (
        <div style={{ textAlign: "center", padding: "60px 0", color: "#444" }}>
          <div style={{ fontSize: 48, marginBottom: 12 }}>📭</div>
          <div style={{ fontSize: 14 }}>Ingen historik än</div>
        </div>
      )}

      {sortedDates.map(datum => (
        <div key={datum} style={{ marginBottom: 24 }}>
          <div style={{
            fontSize: 11,
            color: "#7c6af7",
            letterSpacing: 2,
            textTransform: "uppercase",
            fontWeight: 700,
            marginBottom: 8,
            display: "flex",
            alignItems: "center",
            gap: 10,
          }}>
            {datum}
            <span style={{ color: "#444", fontWeight: 400, letterSpacing: 0 }}>
              {byDate[datum].length} unika VNR · {byDate[datum].reduce((s,r) => s + r.count, 0)} avvikelser
            </span>
            {confirmDelete === datum ? (
              <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ fontSize: 11, color: "#888" }}>Säker?</span>
                <button
                  onClick={() => { onDelete(datum); setConfirmDelete(null); }}
                  style={{
                    background: "#7a1a1a", color: "#fff", border: "none",
                    borderRadius: 5, padding: "2px 10px", fontSize: 11,
                    cursor: "pointer", fontFamily: "inherit",
                  }}
                >Ja, ta bort</button>
                <button
                  onClick={() => setConfirmDelete(null)}
                  style={{
                    background: "#1e1e2e", color: "#888", border: "none",
                    borderRadius: 5, padding: "2px 10px", fontSize: 11,
                    cursor: "pointer", fontFamily: "inherit",
                  }}
                >Avbryt</button>
              </div>
            ) : (
              <div style={{ marginLeft: "auto", display: "flex", gap: 6 }}>
                {moveDate === datum ? (
                  <>
                    <input
                      type="date"
                      value={moveTarget}
                      onChange={e => setMoveTarget(e.target.value)}
                      style={{ background: "#16161f", border: "1px solid #7c6af7", color: "#f0f0f5", borderRadius: 5, padding: "2px 8px", fontSize: 11 }}
                    />
                    <button
                      onClick={() => { if (moveTarget) { onMove(datum, moveTarget, true); setMoveDate(null); setMoveTarget(""); } }}
                      style={{ background: "#60a5fa", color: "#fff", border: "none", borderRadius: 5, padding: "2px 10px", fontSize: 11, cursor: "pointer", fontFamily: "inherit", fontWeight: 700 }}
                    >Endast m. tur</button>
                    <button
                      onClick={() => { if (moveTarget) { onMove(datum, moveTarget, false); setMoveDate(null); setMoveTarget(""); } }}
                      style={{ background: "#7c6af7", color: "#fff", border: "none", borderRadius: 5, padding: "2px 10px", fontSize: 11, cursor: "pointer", fontFamily: "inherit", fontWeight: 700 }}
                    >Alla</button>
                    <button
                      onClick={() => { setMoveDate(null); setMoveTarget(""); }}
                      style={{ background: "#1e1e2e", color: "#888", border: "none", borderRadius: 5, padding: "2px 10px", fontSize: 11, cursor: "pointer", fontFamily: "inherit" }}
                    >Avbryt</button>
                  </>
                ) : (
                  <button
                    onClick={() => { setMoveDate(datum); setMoveTarget(datum); }}
                    style={{ background: "none", border: "1px solid #1e3a5a", color: "#60a5fa", borderRadius: 5, padding: "2px 10px", fontSize: 11, cursor: "pointer", fontFamily: "inherit", letterSpacing: 0.5 }}
                  >→ Flytta</button>
                )}
                <button
                  onClick={() => setConfirmDelete(datum)}
                  style={{ background: "none", border: "1px solid #3a1a1a", color: "#7a3030", borderRadius: 5, padding: "2px 10px", fontSize: 11, cursor: "pointer", fontFamily: "inherit", letterSpacing: 0.5 }}
                >
                  ✕ Ta bort
                </button>
              </div>
            )}
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            {byDate[datum].sort((a,b) => b.count - a.count).map((r, i) => {
              const isEditing = editRow?.datum === datum && editRow?.vnr === r.vnr;
              return (
                <div key={i} style={{
                  background: isEditing ? "#16162a" : "#13131c",
                  border: `1px solid ${isEditing ? "#7c6af7" : "#1e1e2e"}`,
                  borderRadius: 6,
                  padding: "8px 12px",
                  fontSize: 12,
                }}>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 60px 48px 1fr 32px", gap: 8, alignItems: "center" }}>
                    <span style={{ fontFamily: "monospace", color: "#f0f0f5" }}>
                      {r.vnr}
                      {r.locations?.length > 0 && (
                        <span style={{ color: "#8a8a9a", marginLeft: 8, fontSize: 11, fontFamily: "monospace" }}>{r.locations[0]}</span>
                      )}
                      {r.kbana && (
                        <span style={{ color: "#f97316", marginLeft: 6, fontSize: 10, fontWeight: 700 }}>{r.kbana}</span>
                      )}
                      {r.times?.length > 0 && (
                        <span style={{ color: "#7c6af7", marginLeft: 8, fontSize: 10 }}>🕐 {r.times.join(", ")}</span>
                      )}
                      {r.routeCode && (
                        <span style={{ color: "#666", marginLeft: 8, fontSize: 10 }}>
                          Tur {r.routeCode}
                          {r.avgangstid && <span style={{ color: "#60a5fa" }}> · avg {r.avgangstid}</span>}
                          {r.minForeAvgang !== null && r.minForeAvgang !== undefined && (
                            <span style={{ color: r.minForeAvgang < 60 ? "#f87171" : "#4ade80", fontWeight: 700 }}> · {formatMinBefore(r.minForeAvgang, r.nastaDag)}</span>
                          )}
                          {r.nastaDag && <span style={{ color: "#888" }}> · nästa dag</span>}
                        </span>
                      )}
                    </span>
                    <span style={{ textAlign: "center", fontFamily: "monospace", fontWeight: 700, color: r.count >= 10 ? "#f97316" : "#f0f0f5" }}>×{r.count}</span>
                    <Badge text={r.zon} />
                    <span style={{ color: r.orsak === "Okänd" ? "#f97316" : "#a0a0c0", fontSize: 11 }}>
                      {r.orsak}
                      {ORSAK_ANSVAR[r.orsak] && ORSAK_ANSVAR[r.orsak] !== "—" && (
                        <span style={{ color: "#60a5fa", marginLeft: 6, fontSize: 10 }}>→ {ORSAK_ANSVAR[r.orsak]}</span>
                      )}
                      {r.kommentar && <span style={{ color: "#555" }}> · {r.kommentar}</span>}
                    </span>
                    <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                      {r.events?.length > 1 && (
                        <button
                          title="Visa enskilda scans & sätt orsak per scan"
                          onClick={() => setDetailRow({ datum, vnr: r.vnr })}
                          style={{ background: "none", border: "1px solid #2a2a3a", borderRadius: 5, color: "#888", cursor: "pointer", fontSize: 10, padding: "2px 7px", fontFamily: "inherit", whiteSpace: "nowrap" }}
                        >⊞ {r.events.length} scans</button>
                      )}
                      <button
                        onClick={() => {
                          if (isEditing) { setEditRow(null); }
                          else { setEditRow({ datum, vnr: r.vnr }); setEditOrsak(r.orsak || ""); setEditKommentar(r.kommentar || ""); }
                        }}
                        style={{ background: "none", border: "none", color: isEditing ? "#7c6af7" : "#444", cursor: "pointer", fontSize: 14, padding: 0 }}
                      >✎</button>
                    </div>
                  </div>
                  {isEditing && (
                    <div style={{ display: "flex", gap: 8, marginTop: 10, alignItems: "center" }}>
                      <OrsaksSelect value={editOrsak} onChange={v => setEditOrsak(v)} />
                      <input
                        placeholder="Kommentar..."
                        value={editKommentar}
                        onChange={e => setEditKommentar(e.target.value)}
                        style={{ background: "#0f0f18", border: "1px solid #2a2a3a", color: "#f0f0f5", borderRadius: 6, padding: "5px 10px", fontSize: 12, outline: "none", flex: 1 }}
                      />
                      <button
                        onClick={() => { onUpdate(datum, r.vnr, editOrsak, editKommentar); setEditRow(null); }}
                        style={{ background: "#7c6af7", color: "#fff", border: "none", borderRadius: 6, padding: "5px 14px", fontWeight: 700, fontSize: 12, cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap" }}
                      >Spara</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      ))}

      {detailRow && (() => {
        const rec = data.find(r => r.datum === detailRow.datum && r.vnr === detailRow.vnr);
        if (!rec) return null;
        return (
          <ScanDetailModal
            record={rec}
            onClose={() => setDetailRow(null)}
            onSave={(updatedEvents, dominant) => {
              onUpdateEvents(detailRow.datum, detailRow.vnr, updatedEvents, dominant);
              setDetailRow(null);
            }}
          />
        );
      })()}
    </div>
  );
}

// ── Statistik Tab ─────────────────────────────────────────────────────────────

function exportToPDF(filtered, filterDatum, dates, stats) {
  if (!window.jspdf) { alert("PDF-bibliotek laddas inte."); return; }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("p", "mm", "a4");
  const pageW = 210, pageH = 297, m = 14;
  let y = 0;

  const C = {
    bg: [10, 10, 15], card: [19, 19, 28], text: [240, 240, 245],
    dim: [140, 140, 154], purple: [124, 106, 247], orange: [249, 115, 22],
    green: [74, 222, 128], blue: [96, 165, 250],
  };

  pdf.setFillColor(...C.bg);
  pdf.rect(0, 0, pageW, pageH, "F");

  pdf.setTextColor(...C.text);
  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(18);
  pdf.text("AvvikelseLive", m, 18);
  pdf.setTextColor(...C.purple);
  pdf.text("– Statistikrapport", m + 42, 18);
  pdf.setFont("helvetica", "normal");
  pdf.setFontSize(9);
  pdf.setTextColor(...C.dim);
  const period = filterDatum || `${dates[dates.length-1] || ""} - ${dates[0] || ""}`;
  pdf.text(`Period: ${period}`, m, 25);
  pdf.text(`Genererad: ${new Date().toLocaleString("sv-SE")}`, m, 30);
  pdf.setDrawColor(40, 40, 58);
  pdf.line(m, 34, pageW - m, 34);
  y = 44;

  const kpis = [
    { label: "AVVIKELSER", value: stats.totalAvvikelser, color: C.orange },
    { label: "UNIKA VNR", value: stats.totalVNR, color: C.purple },
    { label: "DAGAR", value: stats.dagar, color: C.blue },
    { label: "SNITT/DAG", value: stats.snittDag, color: C.green },
  ];
  const cardW = (pageW - m * 2 - 9) / 4;
  kpis.forEach((k, i) => {
    const x = m + i * (cardW + 3);
    pdf.setFillColor(...C.card);
    pdf.roundedRect(x, y, cardW, 22, 2, 2, "F");
    pdf.setTextColor(...k.color);
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(18);
    pdf.text(String(k.value), x + 4, y + 11);
    pdf.setTextColor(...C.dim);
    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(7);
    pdf.text(k.label, x + 4, y + 18);
  });
  y += 32;

  function barSection(title, rows, maxVal, color) {
    pdf.setTextColor(...C.dim);
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(9);
    pdf.text(title.toUpperCase(), m, y);
    y += 6;
    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(8);
    for (const [label, val] of rows) {
      if (y > pageH - 20) { pdf.addPage(); pdf.setFillColor(...C.bg); pdf.rect(0,0,pageW,pageH,"F"); y = 20; }
      pdf.setTextColor(...C.text);
      pdf.text(String(label).slice(0, 38), m, y);
      pdf.setTextColor(...C.dim);
      const pct = stats.totalAvvikelser ? Math.round(val / stats.totalAvvikelser * 100) : 0;
      pdf.text(`${val} (${pct}%)`, pageW - m, y, { align: "right" });
      y += 2;
      pdf.setFillColor(40, 40, 58);
      pdf.roundedRect(m, y, pageW - m * 2, 2, 1, 1, "F");
      pdf.setFillColor(...color);
      const w = (pageW - m * 2) * (val / maxVal);
      if (w > 0) pdf.roundedRect(m, y, w, 2, 1, 1, "F");
      y += 7;
    }
    y += 4;
  }

  if (stats.perOrsak.length) {
    const maxO = Math.max(...stats.perOrsak.map(r => r[1]), 1);
    barSection("Per orsak", stats.perOrsak, maxO, C.purple);
  }
  if (stats.perZon.length) {
    const maxZ = Math.max(...stats.perZon.map(r => r[1]), 1);
    barSection("Per zon", stats.perZon, maxZ, C.blue);
  }
  if (stats.perKbana.length) {
    const maxK = Math.max(...stats.perKbana.map(r => r[1]), 1);
    barSection("Per K-bana", stats.perKbana, maxK, C.orange);
  }

  const filename = filterDatum ? `avvikelser_rapport_${filterDatum}.pdf` : `avvikelser_rapport.pdf`;
  try {
    const dataUri = pdf.output("datauristring");
    const w = window.open();
    if (w) {
      w.location.href = dataUri;
    } else {
      pdf.save(filename);
    }
  } catch (e) {
    try { pdf.save(filename); } catch (e2) { alert("Kunde inte skapa PDF: " + e2.message); }
  }
}

function exportToExcel(filtered, filterDatum, dates) {
  const wb = XLSX.utils.book_new();

  const rader = loadRader();
  const goal = loadGoal();
  const cost = loadCost();
  const time = loadTime();
  const raderDates = filterDatum ? [filterDatum] : dates;
  const raderPerZon = { "1": 0, "2": 0, "3": 0 };
  for (const d of raderDates) {
    if (rader[d]) {
      raderPerZon["1"] += rader[d]["1"] || 0;
      raderPerZon["2"] += rader[d]["2"] || 0;
      raderPerZon["3"] += rader[d]["3"] || 0;
    }
  }
  const raderTotal = raderPerZon["1"] + raderPerZon["2"] + raderPerZon["3"];
  const prom = (avv, rad) => rad > 0 ? +(avv / rad * 1000).toFixed(2) : "";

  const totalAvvikelser = filtered.reduce((s, r) => s + r.count, 0);
  const totalVNR = filtered.length;
  const dagCount = filterDatum ? 1 : dates.length;

  const summRows = [
    ["AvvikelseLive – Sammanfattning"],
    ["Exporterad", new Date().toLocaleString("sv-SE")],
    ["Period", filterDatum || `${dates[dates.length-1] || "–"} – ${dates[0] || "–"}`],
    [],
    ["Totalt antal avvikelser", totalAvvikelser],
    ["Unika VNR", totalVNR],
    ["Antal dagar", dagCount],
    ["Snitt per dag", dagCount ? Math.round(totalAvvikelser / dagCount) : 0],
    [],
    ["Mål avvikelsegrad (‰)", goal],
    ["Totalt antal rader", raderTotal || "—"],
    ["Avvikelsegrad (‰)", raderTotal ? prom(totalAvvikelser, raderTotal) : "—"],
    [],
    ["Kostnad per avvikelse (kr)", cost],
    ["Total kostnad (kr)", Math.round(totalAvvikelser * cost)],
    ["Minuter per avvikelse", time],
    ["Total nedlagd tid (tim)", +(totalAvvikelser * time / 60).toFixed(1)],
    ["Motsvarar heltidstjänster (40h/v)", dagCount ? +((totalAvvikelser * time / 60) / (40 * (dagCount / 5))).toFixed(1) : "—"],
  ];
  const wsSumm = XLSX.utils.aoa_to_sheet(summRows);
  wsSumm["!cols"] = [{ wch: 28 }, { wch: 20 }];
  XLSX.utils.book_append_sheet(wb, wsSumm, "Sammanfattning");

  const perOrsak = {};
  for (const r of filtered) {
    const dist = orsakBreakdown(r);
    const orsakerInRow = new Set();
    for (const [o, n] of Object.entries(dist)) {
      if (!perOrsak[o]) perOrsak[o] = { avvikelser: 0, vnr: 0 };
      perOrsak[o].avvikelser += n;
      orsakerInRow.add(o);
    }
    // Räkna VNR-dagen för varje orsak den bidrar till (en delad post räknas i flera).
    for (const o of orsakerInRow) perOrsak[o].vnr++;
  }
  const orsakRows = [
    ["Orsak", "Antal avvikelser", "Unika VNR", "Andel %"],
    ...Object.entries(perOrsak)
      .sort((a, b) => b[1].avvikelser - a[1].avvikelser)
      .map(([o, v]) => [o, v.avvikelser, v.vnr, totalAvvikelser ? +(v.avvikelser / totalAvvikelser * 100).toFixed(1) : 0])
  ];
  const wsOrsak = XLSX.utils.aoa_to_sheet(orsakRows);
  wsOrsak["!cols"] = [{ wch: 32 }, { wch: 20 }, { wch: 12 }, { wch: 10 }];
  XLSX.utils.book_append_sheet(wb, wsOrsak, "Per orsak");

  const perZon = {};
  for (const r of filtered) {
    if (!perZon[r.zon]) perZon[r.zon] = 0;
    perZon[r.zon] += r.count;
  }
  const zonRows = [
    ["Zon", "Antal avvikelser", "Andel %", "Antal rader", "Avvikelsegrad ‰"],
    ...Object.entries(perZon)
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([z, count]) => [
        `Zon ${z}`,
        count,
        totalAvvikelser ? +(count / totalAvvikelser * 100).toFixed(1) : 0,
        raderPerZon[z] || "—",
        raderPerZon[z] ? prom(count, raderPerZon[z]) : "—",
      ])
  ];
  const wsZon = XLSX.utils.aoa_to_sheet(zonRows);
  wsZon["!cols"] = [{ wch: 10 }, { wch: 20 }, { wch: 10 }, { wch: 14 }, { wch: 16 }];
  XLSX.utils.book_append_sheet(wb, wsZon, "Per zon");

  const perKbanaExp = {};
  for (const r of filtered) {
    if (r.kbana) {
      if (!perKbanaExp[r.kbana]) perKbanaExp[r.kbana] = 0;
      perKbanaExp[r.kbana] += r.count;
    }
  }
  const kbanaRows = [
    ["K-bana", "Antal avvikelser", "Andel %"],
    ...Object.entries(perKbanaExp)
      .sort((a, b) => b[1] - a[1])
      .map(([k, count]) => [k, count, totalAvvikelser ? +(count / totalAvvikelser * 100).toFixed(1) : 0])
  ];
  const wsKbana = XLSX.utils.aoa_to_sheet(kbanaRows);
  wsKbana["!cols"] = [{ wch: 12 }, { wch: 20 }, { wch: 10 }];
  XLSX.utils.book_append_sheet(wb, wsKbana, "Per K-bana");

  const rawRows = [
    ["Datum", "VNR", "Lagerplats", "K-bana", "Zon", "Tur", "Avgångstid", "Min före avg", "Ship To", "Antal", "Orsak", "Kommentar"],
    ...filtered.map(r => [
      r.datum,
      r.vnr || "",
      r.locations?.[0] || "",
      r.kbana || "",
      `Zon ${r.zon}`,
      r.routeCode || "",
      r.nastaDag ? "nästa dag" : (r.avgangstid || ""),
      r.minForeAvgang !== null && r.minForeAvgang !== undefined ? r.minForeAvgang : "",
      r.shipTo || "",
      r.count,
      r.orsak || "",
      r.kommentar || "",
    ])
  ];
  const wsRaw = XLSX.utils.aoa_to_sheet(rawRows);
  wsRaw["!cols"] = [{ wch: 12 }, { wch: 12 }, { wch: 22 }, { wch: 8 }, { wch: 8 }, { wch: 6 }, { wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 8 }, { wch: 32 }, { wch: 30 }];
  XLSX.utils.book_append_sheet(wb, wsRaw, "Rådata");

  const perAvvRows = [["Datum", "Klockslag", "VNR", "Lagerplats", "K-bana", "Zon", "Tur", "Avgångstid", "Min före avg", "Ship To", "Orsak"]];
  const perAvvData = [];
  for (const r of filtered) {
    if (r.events?.length) {
      for (const ev of r.events) {
        perAvvData.push({
          datum: r.datum,
          tid: ev.tid || "",
          vnr: r.vnr || "",
          loc: ev.location || r.locations?.[0] || "",
          kbana: classifyLocation(ev.location) || r.kbana || "",
          zon: `Zon ${getZon(ev.location) !== "?" ? getZon(ev.location) : r.zon}`,
          route: ev.route || "",
          avg: ev.nastaDag ? "nästa dag" : (ev.avgangstid || ""),
          minFore: ev.minForeAvgang !== null && ev.minForeAvgang !== undefined ? ev.minForeAvgang : "",
          ship: ev.ship || "",
          orsak: r.orsak || "",
        });
      }
    } else {
      const times = r.times?.length ? r.times : [""];
      for (const t of times) {
        perAvvData.push({
          datum: r.datum, tid: t, vnr: r.vnr || "",
          loc: r.locations?.[0] || "", kbana: r.kbana || "", zon: `Zon ${r.zon}`,
          route: r.routeCode || "", avg: r.nastaDag ? "nästa dag" : (r.avgangstid || ""),
          minFore: r.minForeAvgang !== null && r.minForeAvgang !== undefined ? r.minForeAvgang : "",
          ship: r.shipTo || "", orsak: r.orsak || "",
        });
      }
    }
  }
  perAvvData.sort((a, b) => (a.datum + a.tid).localeCompare(b.datum + b.tid));
  for (const d of perAvvData) {
    perAvvRows.push([d.datum, d.tid, d.vnr, d.loc, d.kbana, d.zon, d.route, d.avg, d.minFore, d.ship, d.orsak]);
  }
  const wsPerAvv = XLSX.utils.aoa_to_sheet(perAvvRows);
  wsPerAvv["!cols"] = [{ wch: 12 }, { wch: 10 }, { wch: 12 }, { wch: 22 }, { wch: 10 }, { wch: 8 }, { wch: 6 }, { wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 32 }];
  XLSX.utils.book_append_sheet(wb, wsPerAvv, "Per avvikelse");

  // ── Vecka (nuvarande vs föregående) ──
  // Use ALL data for week comparison (not filtered), so date filter doesn't break it
  const allData = filtered.length === 0 ? [] : (() => {
    // Reconstruct from localStorage to bypass date filter
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch { return filtered; }
  })();

  const toMondayLocal = (d) => {
    const dt = new Date(d);
    const day = (dt.getDay() + 6) % 7;
    dt.setDate(dt.getDate() - day);
    const y = dt.getFullYear();
    const mm = String(dt.getMonth() + 1).padStart(2, "0");
    const dd = String(dt.getDate()).padStart(2, "0");
    return `${y}-${mm}-${dd}`;
  };
  const isoWeek = (key) => {
    const start = new Date(key);
    const d = new Date(Date.UTC(start.getFullYear(), start.getMonth(), start.getDate()));
    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  };

  const weekBuckets = {};
  for (const r of allData) {
    const wk = toMondayLocal(r.datum);
    if (!weekBuckets[wk]) weekBuckets[wk] = [];
    weekBuckets[wk].push(r);
  }
  const weekKeys = Object.keys(weekBuckets).sort().reverse();

  if (weekKeys.length >= 1) {
    const currKey = weekKeys[0];
    const prevKey = weekKeys[1];
    const curr = weekBuckets[currKey] || [];
    const prevFull = prevKey ? weekBuckets[prevKey] : [];

    // Match prev to same weekdays as current
    const weekdayIdxExp = (datum) => {
      const dt = new Date(datum);
      return (dt.getDay() + 6) % 7;
    };
    const currWdays = new Set(curr.map(r => weekdayIdxExp(r.datum)));
    const prev = prevFull.filter(r => currWdays.has(weekdayIdxExp(r.datum)));
    const matchedDaysExp = currWdays.size;

    const sumC = (arr) => arr.reduce((s, r) => s + r.count, 0);
    const sumZon = (arr) => {
      const m = { "1": 0, "2": 0, "3": 0 };
      for (const r of arr) if (m[r.zon] !== undefined) m[r.zon] += r.count;
      return m;
    };
    const sumKbana = (arr) => {
      const m = {};
      for (const r of arr) {
        const kb = r.kbana || classifyLocation(r.locations?.[0]) || "";
        if (kb) m[kb] = (m[kb] || 0) + r.count;
      }
      return m;
    };
    const critical = (arr) => arr.filter(r => r.minForeAvgang !== null && r.minForeAvgang !== undefined && !r.nastaDag && r.minForeAvgang < 30).reduce((s,r) => s + r.count, 0);

    const currTotal = sumC(curr);
    const prevTotal = sumC(prev);
    const diffPct = prevTotal > 0 ? Math.round(((currTotal - prevTotal) / prevTotal) * 100) : null;

    // Rader + promille for current week
    const sumRaderWeek = (arr) => {
      let t = 0;
      const days = [...new Set(arr.map(r => r.datum))];
      for (const d of days) if (rader[d]) t += (rader[d]["1"] || 0) + (rader[d]["2"] || 0) + (rader[d]["3"] || 0);
      return t;
    };
    const currRader = sumRaderWeek(curr);
    const prevRader = sumRaderWeek(prev);
    const currProm = currRader > 0 ? +(currTotal / currRader * 1000).toFixed(2) : null;
    const prevProm = prevRader > 0 ? +(prevTotal / prevRader * 1000).toFixed(2) : null;

    const daysCurr = [...new Set(curr.map(r => r.datum))];
    const daysUnderGoal = daysCurr.filter(d => {
      const dayTotal = curr.filter(r => r.datum === d).reduce((s,r) => s + r.count, 0);
      const dayRader = rader[d] ? (rader[d]["1"] || 0) + (rader[d]["2"] || 0) + (rader[d]["3"] || 0) : 0;
      if (dayRader === 0) return false;
      return (dayTotal / dayRader * 1000) <= goal;
    }).length;
    const daysWithRader = daysCurr.filter(d => rader[d]).length;

    // K-bana changes
    const cKb = sumKbana(curr);
    const pKb = sumKbana(prev);
    const allKb = [...new Set([...Object.keys(cKb), ...Object.keys(pKb)])];
    const kbChanges = allKb.map(k => ({
      k, curr: cKb[k] || 0, prev: pKb[k] || 0, diff: (cKb[k] || 0) - (pKb[k] || 0),
    }));
    const improved = [...kbChanges].filter(c => c.diff < 0).sort((a,b) => a.diff - b.diff);
    const worsened = [...kbChanges].filter(c => c.diff > 0).sort((a,b) => b.diff - a.diff);

    // Build sheet
    const cZon = sumZon(curr);
    const pZon = sumZon(prev);

    const veckaRows = [
      [`AvvikelseLive – Veckosammanfattning`],
      [`Nuvarande vecka`, `v.${isoWeek(currKey)} (${currKey})`],
      [`Föregående vecka`, prevKey ? `v.${isoWeek(prevKey)} (${prevKey})` : "—"],
      [`Jämförelse`, matchedDaysExp < 7 ? `Matchat mot ${matchedDaysExp} ${matchedDaysExp === 1 ? "dag" : "dagar"} (samma veckodagar)` : "Full vecka"],
      [],
      ["JÄMFÖRELSE"],
      ["", "Denna vecka", "Förra veckan", "Diff", "Diff %"],
      ["Totalt avvikelser", currTotal, prevTotal, currTotal - prevTotal, diffPct !== null ? `${diffPct}%` : "—"],
      ["Kritiska (<30 min före avg)", critical(curr), critical(prev), critical(curr) - critical(prev), ""],
      ["Antal rader", currRader || "—", prevRader || "—", "", ""],
      ["Avvikelsegrad ‰", currProm !== null ? currProm : "—", prevProm !== null ? prevProm : "—", "", ""],
      ["Dagar under mål", daysWithRader > 0 ? `${daysUnderGoal}/${daysWithRader}` : "—", "", "", ""],
      ["Kostnad (kr)", Math.round(currTotal * cost), Math.round(prevTotal * cost), Math.round((currTotal - prevTotal) * cost), diffPct !== null ? `${diffPct}%` : "—"],
      ["Nedlagd tid (tim)", +(currTotal * time / 60).toFixed(1), +(prevTotal * time / 60).toFixed(1), +((currTotal - prevTotal) * time / 60).toFixed(1), ""],
      [],
      ["PER ZON"],
      ["Zon", "Denna vecka", "Förra veckan", "Diff"],
      ...["1","2","3"].map(z => [`Zon ${z}`, cZon[z] || 0, pZon[z] || 0, (cZon[z] || 0) - (pZon[z] || 0)]),
      [],
      ["TOPP 3 FÖRBÄTTRADE K-BANOR"],
      ["K-bana", "Förra veckan", "Denna vecka", "Diff"],
      ...(improved.length === 0 ? [["—", "", "", ""]] : improved.slice(0, 3).map(c => [c.k, c.prev, c.curr, c.diff])),
      [],
      ["TOPP 3 FÖRSÄMRADE K-BANOR"],
      ["K-bana", "Förra veckan", "Denna vecka", "Diff"],
      ...(worsened.length === 0 ? [["—", "", "", ""]] : worsened.slice(0, 3).map(c => [c.k, c.prev, c.curr, `+${c.diff}`])),
    ];
    const wsVecka = XLSX.utils.aoa_to_sheet(veckaRows);
    wsVecka["!cols"] = [{ wch: 32 }, { wch: 16 }, { wch: 16 }, { wch: 12 }, { wch: 10 }];
    XLSX.utils.book_append_sheet(wb, wsVecka, "Vecka");
  }

  const filename = filterDatum
    ? `avvikelser_${filterDatum}.xlsx`
    : `avvikelser_${dates[dates.length-1] || "export"}_${dates[0] || ""}.xlsx`;

  XLSX.writeFile(wb, filename);
}

  for (const d of raderDates) {
    if (rader[d]) {
      raderPerZon["1"] += rader[d]["1"] || 0;
      raderPerZon["2"] += rader[d]["2"] || 0;
      raderPerZon["3"] += rader[d]["3"] || 0;
    }
  }
  const raderTotal = raderPerZon["1"] + raderPerZon["2"] + raderPerZon["3"];
  const hasRader = raderTotal > 0;
  const promille = (avv, rad) => rad > 0 ? (avv / rad * 1000) : null;
  const totalPromille = promille(totalAvvikelser, raderTotal);

  const goalColor = (p) => {
    if (p === null) return "#60a5fa";
    if (p <= goal) return "#4ade80";
    if (p <= goal * 1.25) return "#fbbf24";
    return "#f87171";
  };

  const perOrsak = {};
  for (const r of filtered) {
    const dist = orsakBreakdown(r);
    const orsakerInRow = new Set();
    for (const [o, n] of Object.entries(dist)) {
      if (!perOrsak[o]) perOrsak[o] = { count: 0, rows: 0 };
      perOrsak[o].count += n;
      orsakerInRow.add(o);
    }
    for (const o of orsakerInRow) perOrsak[o].rows++;
  }

  const perZon = {};
  for (const r of filtered) {
    if (!perZon[r.zon]) perZon[r.zon] = 0;
    perZon[r.zon] += r.count;
  }

  const vnrMap = {};
  for (const r of filtered.filter(r => r.vnr)) {
    const key = r.vnr;
    if (!vnrMap[key]) vnrMap[key] = { total: 0, zon: r.zon, location: r.locations?.[0] || "" };
    vnrMap[key].total += r.count;
  }
  const topVNR = Object.entries(vnrMap).sort((a,b) => b[1].total - a[1].total).slice(0, 10);

  const barMax = Math.max(...Object.values(perOrsak).map(v => v.count), 1);
  const zonColors = { "1": "#4ade80", "2": "#60a5fa", "3": "#f97316", "?": "#6b7280" };

    const pk = {};
    for (const r of filtered) { if (r.kbana) pk[r.kbana] = (pk[r.kbana] || 0) + r.count; }

            padding: "8px 20px",

            cursor: filtered.length === 0 ? "default" : "pointer",

        >
          ↓ Exportera Excel

        <button
          onClick={() => exportToPDF(filtered, filterDatum, dates, buildPdfStats())}
          disabled={filtered.length === 0}
          style={{
            background: filtered.length === 0 ? "#1e1e2e" : "#dc2626",
            color: filtered.length === 0 ? "#444" : "#fff",
            border: "none",
            borderRadius: 8,
            padding: "8px 20px",
            fontWeight: 700,
            fontSize: 12,
            cursor: filtered.length === 0 ? "default" : "pointer",
            fontFamily: "inherit",

              {seriesKeys.map((k, idx) => {
                const color = colorOf(k, idx);
                const pts = sortedDays.map((d, i) => ({ x: xFor(i), y: yFor(series[k][d] || 0) }));
                const path = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
                return (

                    <path d={path} fill="none" stroke={color} strokeWidth="0.6" vectorEffect="non-scaling-stroke" />
                    {pts.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="0.8" fill={color} vectorEffect="non-scaling-stroke" />)}
