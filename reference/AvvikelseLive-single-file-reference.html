// ── Analys Tab ────────────────────────────────────────────────────────────────

function AnalysTab({ data }) {
  const [aiResult, setAiResult] = useState("");
  const [loading, setLoading] = useState(false);
  const [filterDagar, setFilterDagar] = useState("30");

  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - parseInt(filterDagar));
  const cutoffStr = cutoff.toISOString().slice(0, 10);

  const filtered = filterDagar === "all"
    ? data.filter(r => r.vnr)
    : data.filter(r => r.vnr && r.datum >= cutoffStr);

  if (filtered.length === 0) {
    return (
      <div style={{ textAlign: "center", padding: "60px 0", color: "#444" }}>
        <div style={{ fontSize: 48, marginBottom: 12 }}>🔍</div>
        <div style={{ fontSize: 14 }}>Ingen data att analysera</div>
      </div>
    );
  }

  const totalAvv = filtered.reduce((s, r) => s + r.count, 0);
  const dates = [...new Set(filtered.map(r => r.datum))].sort();

  const zonMap = {};
  for (const r of filtered) {
    if (!zonMap[r.zon]) zonMap[r.zon] = { count: 0, vnrs: new Set() };
    zonMap[r.zon].count += r.count;
    zonMap[r.zon].vnrs.add(r.vnr);
  }
  const zonRank = Object.entries(zonMap).sort((a, b) => b[1].count - a[1].count);

  const vnrDays = {};
  for (const r of filtered) {
    if (!vnrDays[r.vnr]) vnrDays[r.vnr] = { days: new Set(), total: 0, zon: r.zon, orsak: r.orsak, location: r.locations?.[0] || "", kbana: r.kbana || classifyLocation(r.locations?.[0]) || "" };
    vnrDays[r.vnr].days.add(r.datum);
    vnrDays[r.vnr].total += r.count;
  }

  // Longest consecutive-day streak (calendar days) for a set of date strings
  const longestStreak = (daysSet) => {
    const sorted = [...daysSet].sort();
    if (sorted.length === 0) return 0;
    let best = 1, cur = 1;
    for (let i = 1; i < sorted.length; i++) {
      const prevD = new Date(sorted[i - 1]);
      const thisD = new Date(sorted[i]);
      const diffDays = Math.round((thisD - prevD) / 86400000);
      if (diffDays === 1) { cur++; best = Math.max(best, cur); }
      else cur = 1;
    }
    return best;
  };
  // Is the streak still active (includes the most recent data day)?
  const streakActive = (daysSet, lastDataDay) => {
    const sorted = [...daysSet].sort();
    return sorted[sorted.length - 1] === lastDataDay;
  };
  const lastDataDay = dates[dates.length - 1];

  const recurringAll = Object.entries(vnrDays)
    .filter(([, v]) => v.days.size > 1)
    .map(([vnr, v]) => ({
      vnr,
      ...v,
      dagar: v.days.size,
      streak: longestStreak(v.days),
      active: streakActive(v.days, lastDataDay),
    }))
    .sort((a, b) => b.streak - a.streak || b.dagar - a.dagar || b.total - a.total);
  const recurring = recurringAll.slice(0, 8); // kept for AI summary

  const perDay = {};
  for (const r of filtered) {
    if (!perDay[r.datum]) perDay[r.datum] = 0;
    perDay[r.datum] += r.count;
  }
  const dayValues = dates.map(d => perDay[d] || 0);
  const avgFirst = dayValues.slice(0, Math.floor(dayValues.length / 2));
  const avgLast = dayValues.slice(Math.floor(dayValues.length / 2));
  const firstHalfAvg = avgFirst.reduce((s, v) => s + v, 0) / (avgFirst.length || 1);
  const lastHalfAvg = avgLast.reduce((s, v) => s + v, 0) / (avgLast.length || 1);
  const trendDiff = lastHalfAvg - firstHalfAvg;
  const trendLabel = trendDiff > 5 ? "↑ Ökande" : trendDiff < -5 ? "↓ Minskande" : "→ Stabil";
  const trendColor = trendDiff > 5 ? "#f97316" : trendDiff < -5 ? "#4ade80" : "#60a5fa";

  const orsakMap = {};
  forEachOrsak(filtered, (o, n) => { orsakMap[o] = (orsakMap[o] || 0) + n; });
  const topOrsak = Object.entries(orsakMap).sort((a, b) => b[1] - a[1])[0];

  // Mest kritiska tidpunkt (timme med flest avvikelser)
  const hourMap = {};
  for (const r of filtered) {
    if (r.hours?.length) for (const h of r.hours) hourMap[h] = (hourMap[h] || 0) + 1;
  }
  const topHour = Object.entries(hourMap).sort((a, b) => b[1] - a[1])[0];
  const totalHourSamples = Object.values(hourMap).reduce((s, v) => s + v, 0);

  // Konkreta åtgärder – regelbaserade, ingen AI
  const actions = [];
  // 1) Aktiva streaks (dagar i rad, fortfarande pågående)
  for (const v of recurringAll.filter(v => v.streak >= 2 && v.active).slice(0, 12)) {
    actions.push({
      pri: v.streak >= 3 ? "hög" : "medel",
      vnr: v.vnr,
      location: v.location || "",
      kbana: v.kbana || "",
      text: `${v.streak} dagar i rad — ${v.orsak === "Saldofel" ? "inventera platsen" : v.orsak === "Försent påfylld" ? "kolla påfyllningsrutin" : "kolla upp orsak"}`,
      info: `×${v.total} totalt · ${v.orsak || "okänd orsak"}`,
    });
  }
  // 2) Höga upprepningar utan streak (många dagar men inte i rad)
  for (const v of recurringAll.filter(v => v.streak < 2 && v.dagar >= 3).sort((a,b) => b.dagar - a.dagar).slice(0, 8)) {
    actions.push({
      pri: "medel",
      vnr: v.vnr,
      location: v.location || "",
      kbana: v.kbana || "",
      text: `avvikelse ${v.dagar} olika dagar — återkommande problem`,
      info: `×${v.total} totalt · ${v.orsak || "okänd orsak"}`,
    });
  }
  // 3) Hög enskild dagsvolym (≥10 på en VNR samma dag)
  const highSingle = filtered.filter(r => r.count >= 10).sort((a, b) => b.count - a.count).slice(0, 6);
  for (const r of highSingle) {
    actions.push({
      pri: r.count >= 20 ? "hög" : "medel",
      vnr: r.vnr,
      location: r.locations?.[0] || "",
      kbana: r.kbana || classifyLocation(r.locations?.[0]) || "",
      text: `×${r.count} avvikelser på en dag (${r.datum}) — engångstopp, kolla saldo/påfyllning`,
      info: `${r.orsak || "okänd orsak"}`,
    });
  }
  // Dedupe by vnr+text, prioritera hög först
  const seen = new Set();
  const actionsSorted = actions
    .filter(a => { const k = a.vnr + a.text; if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => (a.pri === "hög" ? 0 : 1) - (b.pri === "hög" ? 0 : 1));

  const handleAI = async () => {
    setLoading(true);
    setAiResult("");

    const summary = {
      period: `${dates[0]} – ${dates[dates.length - 1]}`,
      totalAvvikelser: totalAvv,
      antalDagar: dates.length,
      trend: trendLabel,
      perZon: zonRank.map(([z, v]) => ({ zon: `Zon ${z}`, antal: v.count, unikaVNR: v.vnrs.size })),
      perOrsak: Object.entries(orsakMap).sort((a, b) => b[1] - a[1]).map(([o, c]) => ({ orsak: o, antal: c })),
      återkommandeVNR: recurring.map(v => ({ vnr: v.vnr, dagar: v.dagar, streak: v.streak, total: v.total, orsak: v.orsak })),
    };

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: `Du är en lageranalytiker på ett läkemedelsvarulager (SDS/Tamro). Analysera följande avvikelsedata och ge en konkret, handlingsorienterad sammanfattning på svenska. Fokusera på kritiska mönster, rotorsaker och förslag på åtgärder. Var direkt och specifik – inga floskler.\n\nData:\n${JSON.stringify(summary, null, 2)}`
          }]
        })
      });
      const d = await res.json();
      const text = d.content?.find(c => c.type === "text")?.text || "Ingen respons.";
      setAiResult(text);
    } catch (e) {
      setAiResult("Fel vid API-anrop: " + e.message);
    }
    setLoading(false);
  };

  const cardStyle = {
    background: "#13131c",
    border: "1px solid #1e1e2e",
    borderRadius: 10,
    padding: 20,
  };

  return (
    <div>
      <div style={{ display: "flex", gap: 10, marginBottom: 24, alignItems: "center" }}>
        <select value={filterDagar} onChange={e => { setFilterDagar(e.target.value); setAiResult(""); }} style={selectStyle}>
          <option value="3">Senaste 3 dagarna</option>
          <option value="7">Senaste 7 dagarna</option>
          <option value="14">Senaste 14 dagarna</option>
          <option value="30">Senaste 30 dagarna</option>
          <option value="all">All historik</option>
        </select>
        <span style={{ fontSize: 12, color: "#555" }}>{filtered.length} poster · {totalAvv} avvikelser · {dates.length} dagar</span>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 20 }}>
        <div style={cardStyle}>
          <div style={{ fontSize: 11, color: "#555", letterSpacing: 1, textTransform: "uppercase", marginBottom: 12 }}>Trend</div>
          <div style={{ fontSize: 28, fontWeight: 800, color: trendColor, fontFamily: "monospace" }}>{trendLabel}</div>
          <div style={{ fontSize: 12, color: "#666", marginTop: 6 }}>
            Snitt första halvan: {Math.round(firstHalfAvg)}/dag → andra halvan: {Math.round(lastHalfAvg)}/dag
          </div>
        </div>

        <div style={cardStyle}>
          <div style={{ fontSize: 11, color: "#555", letterSpacing: 1, textTransform: "uppercase", marginBottom: 12 }}>Kritisk zon</div>
          {zonRank[0] && (
            <>
              <div style={{ fontSize: 28, fontWeight: 800, color: "#f97316", fontFamily: "monospace" }}>
                Zon {zonRank[0][0]}
              </div>
              <div style={{ fontSize: 12, color: "#666", marginTop: 6 }}>
                {zonRank[0][1].count} avvikelser · {zonRank[0][1].vnrs.size} unika VNR
                {" · "}{Math.round(zonRank[0][1].count / totalAvv * 100)}% av totalt
              </div>
            </>
          )}
        </div>

        <div style={cardStyle}>
          <div style={{ fontSize: 11, color: "#555", letterSpacing: 1, textTransform: "uppercase", marginBottom: 12 }}>Vanligaste orsak</div>
          {topOrsak && (
            <>
              <div style={{ fontSize: 18, fontWeight: 800, color: "#7c6af7" }}>{topOrsak[0]}</div>
              <div style={{ fontSize: 12, color: "#666", marginTop: 6 }}>
                {topOrsak[1]} avvikelser · {Math.round(topOrsak[1] / totalAvv * 100)}% av totalt
              </div>
            </>
          )}
        </div>

        <div style={cardStyle}>
          <div style={{ fontSize: 11, color: "#555", letterSpacing: 1, textTransform: "uppercase", marginBottom: 12 }}>Återkommande VNR</div>
          <div style={{ fontSize: 28, fontWeight: 800, color: "#60a5fa", fontFamily: "monospace" }}>{recurringAll.length}</div>
          <div style={{ fontSize: 12, color: "#666", marginTop: 6 }}>VNR med avvikelse på fler än 1 dag</div>
        </div>
      </div>

      {/* Mest kritiska tidpunkt + snabbfakta */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 20 }}>
        <div style={cardStyle}>
          <div style={{ fontSize: 11, color: "#555", letterSpacing: 1, textTransform: "uppercase", marginBottom: 12 }}>Mest kritiska tidpunkt</div>
          {topHour ? (
            <>
              <div style={{ fontSize: 28, fontWeight: 800, color: "#f97316", fontFamily: "monospace" }}>
                {String(topHour[0]).padStart(2, "0")}–{String((parseInt(topHour[0]) + 1) % 24).padStart(2, "0")}
              </div>
              <div style={{ fontSize: 12, color: "#666", marginTop: 6 }}>
                {topHour[1]} avvikelser registrerade denna timme
                {totalHourSamples > 0 && ` · ${Math.round(topHour[1] / totalHourSamples * 100)}% av alla tidsstämplade`}
              </div>
            </>
          ) : <div style={{ color: "#444", fontSize: 12 }}>Ingen tidsdata</div>}
        </div>

        <div style={cardStyle}>
          <div style={{ fontSize: 11, color: "#555", letterSpacing: 1, textTransform: "uppercase", marginBottom: 12 }}>Aktiva streaks</div>
          <div style={{ fontSize: 28, fontWeight: 800, color: "#f87171", fontFamily: "monospace" }}>
            {recurringAll.filter(v => v.streak >= 2 && v.active).length}
          </div>
          <div style={{ fontSize: 12, color: "#666", marginTop: 6 }}>VNR med pågående avvikelse-streak (≥2 dagar i rad)</div>
        </div>
      </div>

      {/* Konkreta åtgärder – regelbaserade */}
      {actionsSorted.length > 0 && (
        <div style={{ ...cardStyle, marginBottom: 20 }}>
          <div style={{ fontSize: 11, color: "#555", letterSpacing: 1, textTransform: "uppercase", marginBottom: 14 }}>
            ⚡ Att kolla upp – konkreta åtgärder
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {actionsSorted.map((a, i) => (
              <div key={i} style={{
                display: "flex",
                alignItems: "flex-start",
                gap: 10,
                background: "#0f0f18",
                borderRadius: 6,
                borderLeft: `3px solid ${a.pri === "hög" ? "#f87171" : "#fbbf24"}`,
                padding: "10px 12px",
                fontSize: 12,
              }}>
                <span style={{
                  background: a.pri === "hög" ? "#3a1515" : "#3a3015",
                  color: a.pri === "hög" ? "#f87171" : "#fbbf24",
                  borderRadius: 4, padding: "2px 7px", fontSize: 10, fontWeight: 700,
                  textTransform: "uppercase", letterSpacing: 0.5, whiteSpace: "nowrap", marginTop: 1,
                }}>{a.pri}</span>
                <div style={{ flex: 1 }}>
                  <div style={{ color: "#f0f0f5", display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                    <span>VNR <span style={{ fontFamily: "monospace", color: "#60a5fa" }}>{a.vnr}</span></span>
                    {a.location && (
                      <span style={{
                        background: "#1a2535", color: "#7cc4ff", fontFamily: "monospace",
                        fontWeight: 700, fontSize: 12, borderRadius: 4, padding: "2px 8px",
                        letterSpacing: 0.3,
                      }}>📍 {a.location}</span>
                    )}
                    {a.kbana && (
                      <span style={{ color: "#f97316", fontWeight: 700, fontSize: 11 }}>{a.kbana}</span>
                    )}
                  </div>
                  <div style={{ color: "#c0c0d0", marginTop: 4 }}>{a.text}</div>
                  {a.info && <div style={{ color: "#555", fontSize: 11, marginTop: 2 }}>{a.info}</div>}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {recurringAll.length > 0 && (
        <div style={{ ...cardStyle, marginBottom: 20 }}>
          <div style={{ fontSize: 11, color: "#555", letterSpacing: 1, textTransform: "uppercase", marginBottom: 14 }}>
            Återkommande VNR – alla ({recurringAll.length})
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 90px 70px 70px 55px 1fr", gap: 8, padding: "0 12px 6px", fontSize: 10, color: "#555", letterSpacing: 1, textTransform: "uppercase" }}>
            <span>VNR / Plats</span><span>Längsta rad</span><span>Dagar</span><span>Totalt</span><span>Zon</span><span>Orsak</span>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 420, overflowY: "auto" }}>
            {recurringAll.map((v) => (
              <div key={v.vnr} style={{
                display: "grid",
                gridTemplateColumns: "1fr 90px 70px 70px 55px 1fr",
                gap: 8,
                alignItems: "center",
                background: v.active && v.streak >= 2 ? "#15100f" : "#0f0f18",
                border: v.active && v.streak >= 3 ? "1px solid #7a3030" : "1px solid transparent",
                borderRadius: 6,
                padding: "8px 12px",
                fontSize: 12,
              }}>
                <span style={{ fontFamily: "monospace", color: "#f0f0f5" }}>
                  {v.vnr}
                  {v.location && <span style={{ fontSize: 11, color: "#8a8a9a", marginLeft: 8 }}>{v.location}</span>}
                  {v.kbana && <span style={{ color: "#f97316", marginLeft: 6, fontSize: 10, fontWeight: 700 }}>{v.kbana}</span>}
                </span>
                <span style={{ fontFamily: "monospace", fontWeight: 700, color: v.streak >= 3 ? "#f87171" : v.streak >= 2 ? "#fbbf24" : "#888" }}>
                  {v.streak} {v.streak === 1 ? "dag" : "dagar"}{v.active && v.streak >= 2 ? " ●" : ""}
                </span>
                <span style={{ color: "#f97316", fontFamily: "monospace" }}>{v.dagar}</span>
                <span style={{ color: "#888", fontFamily: "monospace" }}>×{v.total}</span>
                <Badge text={v.zon} />
                <span style={{ color: "#555", fontSize: 11 }}>{v.orsak || "—"}</span>
              </div>
            ))}
          </div>
          <div style={{ fontSize: 10, color: "#444", marginTop: 10 }}>
            ● = pågående streak (inkluderar senaste datadagen) · Röd ram = ≥3 dagar i rad och fortfarande aktiv
          </div>
        </div>
      )}

      <div style={cardStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontSize: 11, color: "#555", letterSpacing: 1, textTransform: "uppercase" }}>AI-analys</div>
          <button
            onClick={handleAI}
            disabled={loading}
            style={{
              background: loading ? "#1e1e2e" : "#7c6af7",
              color: loading ? "#555" : "#fff",
              border: "none",
              borderRadius: 8,
              padding: "8px 20px",
              fontWeight: 700,
              fontSize: 12,
              cursor: loading ? "default" : "pointer",
              fontFamily: "inherit",
              letterSpacing: 0.5,
            }}
          >
            {loading ? "Analyserar..." : "✦ Analysera med Claude"}
          </button>
        </div>
        {aiResult ? (
          <div style={{
            fontSize: 13,
            color: "#c0c0d0",
            lineHeight: 1.7,
            whiteSpace: "pre-wrap",
            borderTop: "1px solid #1e1e2e",
            paddingTop: 14,
          }}>
            {aiResult}
          </div>
        ) : (
          <div style={{ fontSize: 12, color: "#444" }}>
            Klicka på knappen för att få en AI-driven sammanfattning av mönster och rotorsaker.
          </div>
        )}
      </div>
    </div>
  );
}

// ── Vecka Tab ─────────────────────────────────────────────────────────────────

function VeckaTab({ data }) {
  const toMonday = (d) => {
    const dt = new Date(d);
    const day = (dt.getDay() + 6) % 7;
    dt.setDate(dt.getDate() - day);
    return dt;
  };
  const fmtDate = (dt) => {
    const y = dt.getFullYear();
    const m = String(dt.getMonth() + 1).padStart(2, "0");
    const da = String(dt.getDate()).padStart(2, "0");
    return `${y}-${m}-${da}`;
  };
  const weekKey = (datum) => fmtDate(toMonday(datum));

  const weeks = {};
  for (const r of data) {
    const k = weekKey(r.datum);
    if (!weeks[k]) weeks[k] = [];
    weeks[k].push(r);
  }
  const sortedWeekKeys = Object.keys(weeks).sort().reverse();

  const [weekIdx, setWeekIdx] = useState(0);
  if (sortedWeekKeys.length === 0) {
    return (
      <div style={{ textAlign: "center", padding: "60px 0", color: "#444" }}>
        <div style={{ fontSize: 48, marginBottom: 12 }}>📅</div>
        <div style={{ fontSize: 14 }}>Ingen data att summera</div>
      </div>
    );
  }
  const currentKey = sortedWeekKeys[weekIdx] || sortedWeekKeys[0];
  const prevKey = sortedWeekKeys[weekIdx + 1];
  const current = weeks[currentKey] || [];
  const prevFull = prevKey ? weeks[prevKey] : [];

  // Match prev week to same weekdays as current (apples-to-apples).
  // Weekday index: Mon=0 ... Sun=6.
  const weekdayIdx = (datum) => {
    const dt = new Date(datum);
    return (dt.getDay() + 6) % 7;
  };
  const currWeekdays = new Set(current.map(r => weekdayIdx(r.datum)));
  const prev = prevFull.filter(r => currWeekdays.has(weekdayIdx(r.datum)));
  const matchedDays = currWeekdays.size;

  const sumCount = (arr) => arr.reduce((s, r) => s + r.count, 0);
  const sumByZon = (arr) => {
    const m = { "1": 0, "2": 0, "3": 0 };
    for (const r of arr) if (m[r.zon] !== undefined) m[r.zon] += r.count;
    return m;
  };
  const sumByKbana = (arr) => {
    const m = {};
    for (const r of arr) {
      // Fallback: derive kbana from location if field is empty (older imports)
      const kb = r.kbana || classifyLocation(r.locations?.[0]) || "";
      if (kb) m[kb] = (m[kb] || 0) + r.count;
    }
    return m;
  };
  const criticalCount = (arr) => arr.filter(r => r.minForeAvgang !== null && r.minForeAvgang !== undefined && !r.nastaDag && r.minForeAvgang < 30).reduce((s,r) => s + r.count, 0);

  const currTotal = sumCount(current);
  const prevTotal = sumCount(prev);
  const diffPct = prevTotal > 0 ? Math.round(((currTotal - prevTotal) / prevTotal) * 100) : null;

  const cost = loadCost();
  const time = loadTime();
  const currKostnad = currTotal * cost;
  const prevKostnad = prevTotal * cost;
  const currTimmar = currTotal * time;

  const currKbana = sumByKbana(current);
  const prevKbana = sumByKbana(prev);
  const allKbanas = [...new Set([...Object.keys(currKbana), ...Object.keys(prevKbana)])];
  const kbanaChanges = allKbanas.map(k => ({
    k, curr: currKbana[k] || 0, prev: prevKbana[k] || 0,
    diff: (currKbana[k] || 0) - (prevKbana[k] || 0),
  }));
  const improved = [...kbanaChanges].filter(c => c.diff < 0).sort((a,b) => a.diff - b.diff).slice(0, 3);
  const worsened = [...kbanaChanges].filter(c => c.diff > 0).sort((a,b) => b.diff - a.diff).slice(0, 3);

  const rader = loadRader();
  const goal = loadGoal();
  const sumRader = (arr) => {
    let t = 0;
    const days = [...new Set(arr.map(r => r.datum))];
    for (const d of days) if (rader[d]) t += (rader[d]["1"] || 0) + (rader[d]["2"] || 0) + (rader[d]["3"] || 0);
    return t;
  };
  const currRader = sumRader(current);
  const currPromille = currRader > 0 ? (currTotal / currRader * 1000) : null;
  const daysInWeek = [...new Set(current.map(r => r.datum))];
  const daysUnderGoal = daysInWeek.filter(d => {
    const dayRecs = current.filter(r => r.datum === d);
    const dayTotal = sumCount(dayRecs);
    const dayRader = rader[d] ? (rader[d]["1"] || 0) + (rader[d]["2"] || 0) + (rader[d]["3"] || 0) : 0;
    if (dayRader === 0) return null;
    return (dayTotal / dayRader * 1000) <= goal;
  }).length;
  const daysWithRader = daysInWeek.filter(d => rader[d]).length;

  const card = {
    background: "#13131c",
    border: "1px solid #1e1e2e",
    borderRadius: 10,
    padding: 20,
  };

  const weekLabel = (key) => {
    const start = new Date(key);
    const end = new Date(start);
    end.setDate(end.getDate() + 6);
    const d = new Date(Date.UTC(start.getFullYear(), start.getMonth(), start.getDate()));
    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    return `v.${weekNo} (${fmtDate(start)} – ${fmtDate(end)})`;
  };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20 }}>
        <button onClick={() => setWeekIdx(Math.min(sortedWeekKeys.length - 1, weekIdx + 1))}
          disabled={weekIdx >= sortedWeekKeys.length - 1}
          style={{ background: "#1e1e2e", color: "#888", border: "none", borderRadius: 6, padding: "6px 12px", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>← Tidigare</button>
        <div style={{ fontSize: 13, fontWeight: 700, color: "#f0f0f5", minWidth: 240, textAlign: "center" }}>{weekLabel(currentKey)}</div>
        <button onClick={() => setWeekIdx(Math.max(0, weekIdx - 1))}
          disabled={weekIdx === 0}
          style={{ background: "#1e1e2e", color: "#888", border: "none", borderRadius: 6, padding: "6px 12px", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>Senare →</button>
        <span style={{ marginLeft: "auto", fontSize: 11, color: "#555" }}>{daysInWeek.length} dagar med data</span>
      </div>

      <div style={{ ...card, marginBottom: 20 }}>
        <div style={{ fontSize: 11, color: "#555", letterSpacing: 1, textTransform: "uppercase", marginBottom: 12 }}>Jämfört med föregående vecka</div>
        <div style={{ display: "flex", alignItems: "baseline", gap: 16 }}>
          <div style={{ fontSize: 36, fontWeight: 800, color: "#f0f0f5", fontFamily: "monospace" }}>{currTotal}</div>
          <div style={{ fontSize: 14, color: "#888" }}>avvikelser totalt</div>
          {diffPct !== null && (
            <div style={{
              marginLeft: "auto", fontSize: 22, fontWeight: 800, fontFamily: "monospace",
              color: diffPct > 0 ? "#f87171" : diffPct < 0 ? "#4ade80" : "#888",
            }}>
              {diffPct > 0 ? "↑" : diffPct < 0 ? "↓" : "→"} {Math.abs(diffPct)}%
            </div>
          )}
        </div>
        <div style={{ fontSize: 11, color: "#555", marginTop: 8 }}>
          Förra veckan: {prevTotal} avvikelser ({prevKey ? weekLabel(prevKey) : "ingen data"})
          {prevKey && matchedDays < 7 && (
            <span style={{ color: "#fbbf24", marginLeft: 8 }}>
              · matchat mot {matchedDays} {matchedDays === 1 ? "dag" : "dagar"} (samma veckodagar)
            </span>
          )}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 12, marginBottom: 20 }}>
        <div style={card}>
          <div style={{ fontSize: 24, fontWeight: 800, color: "#f87171", fontFamily: "monospace" }}>{criticalCount(current)}</div>
          <div style={{ fontSize: 11, color: "#555", letterSpacing: 1, textTransform: "uppercase", marginTop: 4 }}>{"< 30 min före avg"}</div>
        </div>
        <div style={card}>
          <div style={{ fontSize: 24, fontWeight: 800, color: currPromille && currPromille > goal ? "#f87171" : "#4ade80", fontFamily: "monospace" }}>
            {currPromille !== null ? currPromille.toFixed(2) + "‰" : "—"}
          </div>
          <div style={{ fontSize: 11, color: "#555", letterSpacing: 1, textTransform: "uppercase", marginTop: 4 }}>Avvikelsegrad</div>
        </div>
        <div style={card}>
          <div style={{ fontSize: 24, fontWeight: 800, color: "#60a5fa", fontFamily: "monospace" }}>
            {daysWithRader > 0 ? `${daysUnderGoal}/${daysWithRader}` : "—"}
          </div>
          <div style={{ fontSize: 11, color: "#555", letterSpacing: 1, textTransform: "uppercase", marginTop: 4 }}>Dagar under mål</div>
        </div>
        <div style={card}>
          <div style={{ fontSize: 22, fontWeight: 800, color: "#fbbf24", fontFamily: "monospace" }}>{fmtKr(currKostnad)}</div>
          <div style={{ fontSize: 11, color: "#555", letterSpacing: 1, textTransform: "uppercase", marginTop: 4 }}>
            Kostnad
            {prevTotal > 0 && (
              <span style={{ color: currKostnad > prevKostnad ? "#f87171" : "#4ade80", marginLeft: 6 }}>
                ({currKostnad > prevKostnad ? "+" : ""}{fmtKr(currKostnad - prevKostnad)})
              </span>
            )}
          </div>
        </div>
        <div style={card}>
          <div style={{ fontSize: 22, fontWeight: 800, color: "#f97316", fontFamily: "monospace" }}>{fmtTimmar(currTimmar)}</div>
          <div style={{ fontSize: 11, color: "#555", letterSpacing: 1, textTransform: "uppercase", marginTop: 4 }}>Nedlagd tid</div>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 20 }}>
        <div style={card}>
          <div style={{ fontSize: 11, color: "#555", letterSpacing: 1, textTransform: "uppercase", marginBottom: 12 }}>↓ Topp 3 förbättrade K-banor</div>
          {improved.length === 0 ? <div style={{ color: "#444", fontSize: 12 }}>Inga förbättringar</div> :
            improved.map(c => (
              <div key={c.k} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid #1a1a28", fontSize: 12 }}>
                <span style={{ color: "#f97316", fontFamily: "monospace", fontWeight: 700 }}>{c.k}</span>
                <span style={{ color: "#888" }}>{c.prev} → {c.curr}</span>
                <span style={{ color: "#4ade80", fontFamily: "monospace", fontWeight: 700 }}>{c.diff}</span>
              </div>
            ))}
        </div>
        <div style={card}>
          <div style={{ fontSize: 11, color: "#555", letterSpacing: 1, textTransform: "uppercase", marginBottom: 12 }}>↑ Topp 3 försämrade K-banor</div>
          {worsened.length === 0 ? <div style={{ color: "#444", fontSize: 12 }}>Inga försämringar</div> :
            worsened.map(c => (
              <div key={c.k} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid #1a1a28", fontSize: 12 }}>
                <span style={{ color: "#f97316", fontFamily: "monospace", fontWeight: 700 }}>{c.k}</span>
                <span style={{ color: "#888" }}>{c.prev} → {c.curr}</span>
                <span style={{ color: "#f87171", fontFamily: "monospace", fontWeight: 700 }}>+{c.diff}</span>
              </div>
            ))}
        </div>
      </div>

      <div style={card}>
        <div style={{ fontSize: 11, color: "#555", letterSpacing: 1, textTransform: "uppercase", marginBottom: 12 }}>Per zon (denna vecka vs förra)</div>
        {["1","2","3"].map(z => {
          const c = sumByZon(current)[z] || 0;
          const p = sumByZon(prev)[z] || 0;
          const diff = c - p;
          return (
            <div key={z} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid #1a1a28", fontSize: 13 }}>
              <span style={{ color: "#f0f0f5" }}>Zon {z}</span>
              <span style={{ color: "#888", fontFamily: "monospace" }}>{p} → {c}</span>
              <span style={{ color: diff > 0 ? "#f87171" : diff < 0 ? "#4ade80" : "#888", fontFamily: "monospace", fontWeight: 700, minWidth: 50, textAlign: "right" }}>
                {diff > 0 ? `+${diff}` : diff}
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────

function AvvikelseLive() {
  const [tab, setTab] = useState("import");
  const [data, setData] = useState([]);

  useEffect(() => {
    setData(loadData());
  }, []);

  // Lagringsvarning: localStorage-taket är ~5 MB. Varna i god tid (vid 3 MB).
  const storageMB = getStorageBytes() / (1024 * 1024);
  const storageWarn = storageMB >= 3;

  const handleSave = useCallback(async (records, datum) => {
    setData(prev => {
      const existingForDay = prev.filter(r => r.datum === datum);
      const existingByVNR = new Map(existingForDay.map(r => [r.vnr, r]));
      const otherDays = prev.filter(r => r.datum !== datum);
      const merged = records.map(r => {
        const old = existingByVNR.get(r.vnr);
        if (old) {
          return {
            ...r,
            orsak: r.orsak && r.orsak !== "Okänd" ? r.orsak : (old.orsak || r.orsak),
            kommentar: r.kommentar || old.kommentar,
          };
        }
        return r;
      });
      const next = [...otherDays, ...merged];
      saveData(next);
      return next;
    });
  }, []);

  const handleUpdate = useCallback((datum, vnr, orsak, kommentar) => {
    setData(prev => {
      const next = prev.map(r =>
        r.datum === datum && r.vnr === vnr ? { ...r, orsak, kommentar } : r
      );
      saveData(next);
      return next;
    });
  }, []);

  // Sparar per-scan-orsaker (events) och sätter VNR-dagens huvudorsak till den dominanta.
  // Auto-detekteringen påverkas inte — detta är manuell finjustering i efterhand.
  const handleUpdateEvents = useCallback((datum, vnr, events, dominant) => {
    setData(prev => {
      const next = prev.map(r =>
        r.datum === datum && r.vnr === vnr
          ? { ...r, events, orsak: dominant || r.orsak }
          : r
      );
      saveData(next);
      return next;
    });
  }, []);

  const handleMove = useCallback((fromDatum, toDatum, onlyWithRoute = false) => {
    if (fromDatum === toDatum) return;
    setData(prev => {
      const toMove = prev.filter(r => r.datum === fromDatum && (!onlyWithRoute || r.routeCode));
      const stays = prev.filter(r => !(r.datum === fromDatum && (!onlyWithRoute || r.routeCode)));
      const moved = toMove.map(r => ({ ...r, datum: toDatum }));
      const movedVNRs = new Set(moved.map(r => r.vnr));
      const cleaned = stays.filter(r => !(r.datum === toDatum && movedVNRs.has(r.vnr)));
      const next = [...cleaned, ...moved];
      saveData(next);
      return next;
    });
  }, []);

  const handleDelete = useCallback((datum) => {
    setData(prev => {
      const next = prev.filter(r => r.datum !== datum);
      saveData(next);
      return next;
    });
  }, []);

  const tabs = [
    { id: "import", label: "📥 Importera" },
    { id: "historik", label: "📋 Historik" },
    { id: "statistik", label: "📊 Statistik" },
    { id: "vecka", label: "📅 Vecka" },
    { id: "analys", label: "🔍 Analys" },
  ];

  return (
    <div style={{
      minHeight: "100vh",
      background: "#0a0a0f",
      color: "#f0f0f5",
      fontFamily: "'IBM Plex Mono', 'Courier New', monospace",
    }}>
      <div style={{
        borderBottom: "1px solid #1e1e2e",
        padding: "20px 32px 0",
        background: "#0d0d15",
      }}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 12, marginBottom: 20 }}>
          <h1 style={{
            margin: 0,
            fontSize: 20,
            fontWeight: 800,
            letterSpacing: -0.5,
            color: "#f0f0f5",
          }}>
            Avvikelse<span style={{ color: "#7c6af7" }}>Live</span>
          </h1>
          <span style={{ fontSize: 11, color: "#444", letterSpacing: 1 }}>SDS · DEV 92</span>
          <span style={{ marginLeft: "auto", fontSize: 11, color: "#444" }}>
            {data.length} poster · {[...new Set(data.map(r=>r.datum))].length} dagar
          </span>
        </div>

        <div style={{ display: "flex", gap: 0 }}>
          {tabs.map(t => (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              style={{
                background: "none",
                border: "none",
                borderBottom: `2px solid ${tab === t.id ? "#7c6af7" : "transparent"}`,
                color: tab === t.id ? "#f0f0f5" : "#555",
                padding: "10px 20px",
                cursor: "pointer",
                fontSize: 13,
                fontFamily: "inherit",
                fontWeight: tab === t.id ? 700 : 400,
                letterSpacing: 0.3,
                transition: "all .15s",
              }}
            >
              {t.label}
            </button>
          ))}
        </div>
      </div>

      {storageWarn && (
        <div style={{
          background: "#2a1500",
          borderBottom: "1px solid #7a5a00",
          padding: "8px 32px",
          fontSize: 12,
          color: "#f0c040",
          display: "flex",
          alignItems: "center",
          gap: 10,
        }}>
          ⚠ Lagringsutrymmet börjar bli fullt ({storageMB.toFixed(1)} MB av ~5 MB).
          Exportera till Excel som backup (Statistik → Exportera) och överväg att ta bort gamla datum i Historik.
        </div>
      )}

      <div style={{ padding: "24px 32px", maxWidth: 1100, margin: "0 auto" }}>
        {tab === "import" && <ImportTab onSave={handleSave} existingData={data} />}
        {tab === "historik" && <HistorikTab data={data} onDelete={handleDelete} onUpdate={handleUpdate} onUpdateEvents={handleUpdateEvents} onMove={handleMove} />}
        {tab === "statistik" && <StatistikTab data={data} />}
        {tab === "analys" && <AnalysTab data={data} />}
        {tab === "vecka" && <VeckaTab data={data} />}
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AvvikelseLive />);
  </script>
</body>
</html>
